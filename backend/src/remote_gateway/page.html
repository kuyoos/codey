<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Codey">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex,nofollow">
  <title>Codey 远程控制</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b8cff'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='700' text-anchor='middle' fill='%230b1020' font-family='system-ui'%3EC%3C/text%3E%3C/svg%3E">
  <style>
    /* ---------- 设计变量：移动端优先的暗色主题 ---------- */
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --surface: #151920;
      --surface-2: #1c212a;
      --surface-3: #232a35;
      --line: #252c37;
      --line-2: #323b49;
      --text: #e9ecf2;
      --muted: #98a3b4;
      --faint: #6b7686;
      --accent: #5b8cff;
      --accent-2: #8b7bff;
      --accent-dim: rgba(91, 140, 255, .15);
      --ok: #48d597;
      --warn: #f5c451;
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --tap: 42px;
      --shadow: 0 14px 40px rgba(0, 0, 0, .5);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    a { color: var(--accent); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #2b333f; border-radius: 99px; border: 3px solid transparent; background-clip: content-box;
    }

    /* ---------- 骨架 ---------- */
    /* 固定在可见视口上：键盘弹出时脚本同步 top/height，输入栏不会被顶出屏幕或盖住正文。 */
    .app {
      position: fixed; left: 0; right: 0; top: 0; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .topbar {
      flex: none; display: flex; align-items: center; gap: 6px;
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
      background: rgba(15, 17, 21, .88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      position: relative; z-index: 30;
    }
    .logo {
      width: 26px; height: 26px; border-radius: 8px; flex: none;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; color: #0b1020; font-size: 14px; font-weight: 700;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .grow { flex: 1; min-width: 0; }
    .status {
      display: inline-flex; align-items: center; gap: 6px; flex: none;
      padding: 3px 9px; border-radius: 999px; background: var(--surface-2);
      color: var(--muted); font-size: 12px; white-space: nowrap;
    }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
    .status.on .dot { background: var(--ok); animation: pulse 2.4s ease-in-out infinite; }
    .status.off .dot { background: var(--danger); }
    .status.warn .dot { background: var(--warn); }
    @keyframes pulse { 50% { opacity: .35; } }
    .icon-btn {
      width: var(--tap); height: var(--tap); border-radius: 12px; flex: none;
      display: grid; place-items: center; color: var(--muted);
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .chip-btn {
      display: inline-flex; align-items: center; gap: 6px; flex: none; max-width: 40vw;
      padding: 6px 11px; border-radius: 999px; font-size: 12.5px;
      background: var(--surface-2); border: 1px solid var(--line);
      white-space: nowrap;
    }
    .chip-btn:hover { border-color: var(--line-2); }
    .chip-btn .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-btn .k { color: var(--faint); font-size: 11px; }
    /* 上下文圆圈：贴在标题栏右侧，只表示最近一次请求占模型窗口的比例。 */
    .ctx-ring {
      position: relative; flex: none; width: 28px; height: 28px;
      display: grid; place-items: center; color: var(--accent);
    }
    .ctx-ring svg { width: 28px; height: 28px; transform: rotate(-90deg); }
    .ctx-ring circle { fill: none; stroke-width: 3.5; }
    .ctx-ring .ctx-track { stroke: var(--surface-3); }
    .ctx-ring .ctx-fill {
      stroke: currentColor; stroke-linecap: round;
      stroke-dasharray: 97.39; stroke-dashoffset: 97.39;
      transition: stroke-dashoffset .3s ease;
    }
    .ctx-ring.warn { color: var(--warn); }
    .ctx-ring .ctx-pct {
      position: absolute; color: var(--muted); font-size: 9px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .body { flex: 1; display: flex; min-height: 0; position: relative; }

    /* ---------- 会话列表 ---------- */
    .sidebar {
      width: 332px; flex: none; min-height: 0; display: flex; flex-direction: column;
      background: var(--surface); border-right: 1px solid var(--line);
    }
    .sidebar-head { flex: none; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
    .search { position: relative; flex: 1; min-width: 0; }
    .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--faint); fill: none; stroke-width: 2; }
    .search input {
      width: 100%; height: 38px; padding: 0 12px 0 32px; border-radius: 11px;
      background: var(--surface-2); border: 1px solid var(--line); outline: none;
    }
    .search input:focus { border-color: var(--accent); }
    .count { flex: none; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
    .thread-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 8px 12px; -webkit-overflow-scrolling: touch; }
    /* 会话按项目（工作目录）分组，组标题滚动时吸附在列表顶部。 */
    .group-label {
      position: sticky; top: -2px; z-index: 1; background: var(--surface);
      display: flex; align-items: baseline; gap: 8px;
      padding: 12px 8px 6px; color: var(--muted); font-size: 12px; font-weight: 600;
    }
    .group-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-count { margin-left: auto; flex: none; color: var(--faint); font-size: 11.5px; font-weight: 400; font-variant-numeric: tabular-nums; }
    .thread {
      padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid transparent; display: flex; flex-direction: column; gap: 2px;
    }
    .thread:hover { background: var(--surface-2); }
    .thread.active { background: var(--accent-dim); border-color: rgba(91, 140, 255, .35); }
    .t-top { display: flex; align-items: center; gap: 6px; }
    .t-name { font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-prev { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-meta { color: var(--faint); font-size: 11.5px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; }
    .t-meta .sep { opacity: .5; }
    .run-badge {
      display: inline-flex; align-items: center; gap: 4px; flex: none;
      padding: 1px 7px; border-radius: 999px; font-size: 11px;
      background: rgba(72, 213, 151, .14); color: var(--ok);
    }
    .run-badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
    .sidebar-foot {
      flex: none; padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      border-top: 1px solid var(--line); color: var(--faint); font-size: 11.5px; line-height: 1.5;
    }

    /* ---------- 对话区 ---------- */
    .chat { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .chat-head {
      flex: none; padding: 9px 14px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .chat-titles { min-width: 0; flex: 1; }
    .chat-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-meta { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .transcript {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      padding: 14px 14px 8px;
    }
    .turn { display: flex; flex-direction: column; gap: 7px; }
    .turn + .turn { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .turn-head { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11.5px; }
    .turn-head .line { flex: 1; height: 1px; background: var(--line); }
    .turn-head .meta { color: var(--faint); white-space: nowrap; }
    /* 回合收尾统计：耗时、token 与思考次数放在回合末尾，运行中的那份显示在状态条里。 */
    .turn-foot { color: var(--faint); font-size: 11.5px; margin-top: 8px; }
    .turn.flash { animation: flash 1.2s ease; }
    @keyframes flash { 0%, 100% { background: transparent; } 20% { background: var(--accent-dim); } }
    .chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 1.5px 8px; border-radius: 999px;
      font-size: 11.5px; background: var(--surface-2); color: var(--muted); white-space: nowrap;
    }
    .chip.ok { color: var(--ok); background: rgba(72, 213, 151, .12); }
    .chip.run { color: var(--accent); background: var(--accent-dim); }
    .chip.warn { color: var(--warn); background: rgba(245, 196, 81, .12); }
    .chip.bad { color: var(--danger); background: rgba(248, 113, 113, .12); }
    .chip.run i, .chip.run b { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
    .msg.user {
      align-self: flex-end; max-width: 88%; white-space: pre-wrap; word-break: break-word;
      background: linear-gradient(180deg, #26324a, #202a3d);
      border: 1px solid rgba(91, 140, 255, .28);
      border-radius: 16px 16px 4px 16px; padding: 9px 12px;
    }
    .msg.agent { max-width: 100%; }
    /* 用户消息里的图片只报张数，不在这里展开，避免正文被大图挤开。 */
    .msg.user .msg-images { margin-top: 4px; color: var(--faint); font-size: 12px; }
    /* 编辑与复制默认隐藏，悬停或聚焦时出现，触屏设备上常驻，避免正文被按钮挤占。 */
    .msg-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; opacity: 0; transition: opacity .15s ease; }
    .msg.user:hover .msg-actions, .msg.user:focus-within .msg-actions { opacity: 1; }
    .msg-actions button {
      padding: 2px 8px; border-radius: 7px; font-size: 11.5px; color: var(--muted);
      background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2);
    }
    .msg-actions button:hover { color: var(--text); }
    @media (hover: none) { .msg-actions { opacity: .75; } }
    .caret::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: pulse 1s steps(2, start) infinite; }
    .more-btn {
      align-self: center; margin: 4px 0 10px; padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); font-size: 12.5px;
    }
    .more-hint { align-self: center; margin: 4px 0 10px; color: var(--faint); font-size: 12px; }

    /* ---------- Markdown ---------- */
    .md-p { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .md-h { margin: 12px 0 4px; font-weight: 650; }
    .md-h1 { font-size: 18px; } .md-h2 { font-size: 16.5px; } .md-h3 { font-size: 15.5px; } .md-h4 { font-size: 15px; }
    .md-list { margin: 6px 0; padding-left: 20px; }
    .md-list li { margin: 2px 0; }
    .md-quote { margin: 8px 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line-2); color: var(--muted); }
    .md-code {
      padding: 1.5px 5px; border-radius: 6px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 13px; background: var(--surface-3); overflow-wrap: anywhere;
    }
    .md-link { text-decoration: none; border-bottom: 1px solid rgba(91, 140, 255, .4); }
    .md-del { color: var(--muted); text-decoration: line-through; }
    .md-img { display: block; max-width: 100%; border-radius: 10px; margin: 8px 0; }
    .md-hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
    .md-task { display: flex; align-items: flex-start; gap: 7px; }
    .md-task input { flex: none; margin: 4px 0 0; accent-color: var(--accent); }
    .md-table { display: block; width: 100%; margin: 9px 0; border-collapse: collapse; overflow-x: auto; font-size: 13px; }
    .md-table th, .md-table td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
    .md-table th { background: var(--surface-2); font-weight: 600; }
    .md-list .md-list { margin: 2px 0 2px 2px; }
    .md-h5 { font-size: 14.5px; } .md-h6 { font-size: 14px; color: var(--muted); }
    .code-block { margin: 9px 0; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: #0c0e12; }
    .code-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 5px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line);
      color: var(--faint); font-size: 11.5px;
    }
    .code-head .copy { color: var(--muted); font-size: 11.5px; padding: 2px 6px; border-radius: 6px; }
    .code-head .copy:hover { background: var(--surface-3); color: var(--text); }
    .code-block pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; }
    .code-block code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; white-space: pre; }

    /* ---------- 工具卡片 ---------- */
    .card { margin: 8px 0; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
    .card-head .icon { color: var(--faint); font-family: ui-monospace, Menlo, Consolas, monospace; flex: none; }
    .card-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
    .card-sub { padding: 0 10px 8px; color: var(--faint); font-size: 11.5px; word-break: break-all; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .card-pre {
      margin: 0; padding: 9px 10px; background: #0c0e12; border-top: 1px solid var(--line);
      font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto;
    }
    details.raw { border-top: 1px solid var(--line); }
    details.raw > summary {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none;
    }
    details.raw > summary::-webkit-details-marker { display: none; }
    details.raw > summary::before { content: "▸"; color: var(--faint); flex: none; }
    details.raw[open] > summary::before { content: "▾"; }
    .raw-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    summary .copy { flex: none; color: var(--muted); font-size: 11.5px; padding: 2px 7px; border-radius: 6px; }
    summary .copy:hover { background: var(--surface-3); color: var(--text); }
    /* 工具、命令、文件改动与图片都只留一行计数，和聊天里的元信息一样轻。 */
    .tool-note {
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
      margin: 4px 0; padding: 3px 10px; border-radius: 999px;
      background: var(--surface-2); color: var(--faint); font-size: 12px;
    }
    .tool-note .icon { color: var(--faint); }
    details.card {
      border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
      overflow: hidden; margin: 8px 0;
    }
    details.card > summary {
      display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      cursor: pointer; color: var(--muted); font-size: 13px; list-style: none;
    }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::before { content: "▸"; color: var(--faint); flex: none; }
    details.card[open] > summary::before { content: "▾"; }
    details.card[open] > summary { border-bottom: 1px solid var(--line); }
    details.card .icon { color: var(--faint); flex: none; }

    /* ---------- 审批 ---------- */
    .approval-host { flex: none; padding: 0 14px; }
    .approval-card {
      margin: 8px 0; border: 1px solid rgba(245, 196, 81, .45); background: rgba(245, 196, 81, .09);
      border-radius: var(--radius); padding: 10px 12px;
    }
    .approval-card .label { color: var(--warn); font-size: 12.5px; font-weight: 600; }
    .approval-card .body { margin: 4px 0 8px; font-size: 13px; word-break: break-word; }
    .approval-card pre { margin: 4px 0 8px; padding: 8px; background: #0c0e12; border-radius: 8px; font-size: 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
    .approval-card .actions { display: flex; gap: 8px; }
    .approval-card .actions button { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--line-2); }
    .approval-card .actions .allow { background: var(--accent); border-color: var(--accent); color: #08101c; font-weight: 600; }

    /* ---------- 输入区 ---------- */
    /* 排队待发的消息：贴在输入框上方，可插队立即执行或删除。 */
    .queue-box {
      flex: none; border-top: 1px solid var(--line);
      background: rgba(15, 17, 21, .92); backdrop-filter: blur(14px);
    }
    .queue-box:not([hidden]) + .runbar { border-top: 0; }
    .queue-head { padding: 5px 12px 0; color: var(--faint); font-size: 11.5px; }
    .queue-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
    .queue-text { flex: 1; min-width: 0; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-actions { flex: none; display: flex; gap: 4px; }
    .queue-btn { padding: 3px 9px; border-radius: 8px; background: var(--surface-3); color: var(--text); font-size: 11.5px; }
    .queue-btn:hover { background: var(--line-2); }
    .queue-btn.danger { color: var(--danger); }
    /* 运行状态条：紧贴输入框上方，回合进行中显示用时、token 与思考次数。 */
    .runbar {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; border-top: 1px solid var(--line);
      background: rgba(15, 17, 21, .92); backdrop-filter: blur(14px);
      color: var(--muted); font-size: 12.5px;
    }
    .runbar .run-dot {
      width: 7px; height: 7px; flex: none; border-radius: 50%;
      background: var(--accent); animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .25; } }
    .runbar .run-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 连接状态条：贴在输入框上方，回合运行时让位给运行状态条，避免两行状态叠在一起。 */
    .connbar {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-top: 1px solid var(--line);
      background: rgba(15, 17, 21, .92); backdrop-filter: blur(14px);
      color: var(--muted); font-size: 12.5px;
    }
    /* 这里只留小圆点与文字，不再画成顶部那种胶囊。 */
    .connbar .status { padding: 0; background: transparent; font-size: 12.5px; }
    .runbar:not([hidden]) ~ .connbar { display: none; }
    /* 相邻的状态条与输入框只留一条边线。 */
    .runbar:not([hidden]) ~ .composer,
    .runbar:not([hidden]) ~ .attach-bar,
    .connbar:not([hidden]) ~ .composer,
    .connbar:not([hidden]) ~ .attach-bar,
    .attach-bar:not([hidden]) + .composer,
    .queue-box:not([hidden]) ~ .connbar { border-top: 0; }
    /* 待发送的图片：和状态条一样贴在输入框上方，横向滚动不换行。 */
    .attach-bar {
      flex: none; display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; overflow-x: auto; overscroll-behavior-x: contain;
      background: rgba(15, 17, 21, .92); backdrop-filter: blur(14px);
      border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch;
    }
    .attach-thumb {
      position: relative; flex: none; width: 54px; height: 54px; overflow: hidden;
      border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2);
    }
    .attach-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .attach-thumb.pending { display: grid; place-items: center; color: var(--faint); font-size: 10.5px; }
    .attach-remove {
      position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
      display: grid; place-items: center; background: rgba(15, 17, 21, .82); color: var(--text);
      font-size: 12px; line-height: 1;
    }
    .attach-hint { flex: none; color: var(--faint); font-size: 11.5px; }
    .composer {
      flex: none; display: flex; align-items: flex-end; gap: 8px;
      padding: 9px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: rgba(15, 17, 21, .92); backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      position: relative;
    }
    .composer textarea {
      flex: 1; min-width: 0; resize: none; max-height: 40vh; min-height: 42px;
      padding: 10px 12px; border-radius: 13px; outline: none;
      background: var(--surface-2); border: 1px solid var(--line); line-height: 1.5;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer .cmd-btn {
      width: var(--tap); height: var(--tap); flex: none; border-radius: 13px; display: grid; place-items: center;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-weight: 600;
    }
    .composer .cmd-btn:active { color: var(--accent); border-color: var(--accent); }
    /* 图片按钮比「/」窄一点，手机上四个按钮加输入框才不会太挤。 */
    .composer .attach-btn {
      width: 38px; height: var(--tap); flex: none; border-radius: 13px; display: grid; place-items: center;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
    }
    .composer .attach-btn:active { color: var(--accent); border-color: var(--accent); }
    .composer .attach-btn[disabled] { opacity: .45; }
    .composer .send {
      width: var(--tap); height: var(--tap); flex: none; border-radius: 13px; display: grid; place-items: center;
      background: var(--accent); color: #08101c;
    }
    .composer .send:disabled { opacity: .45; }
    .composer .stop { background: var(--surface-2); border: 1px solid var(--line-2); color: var(--danger); border-radius: 13px; }
    .composer svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- 斜杠命令补全 ---------- */
    .slash {
      position: absolute; left: 12px; right: 12px; bottom: calc(100% + 8px); z-index: 15;
      max-height: min(46vh, 320px); overflow-y: auto; overscroll-behavior: contain;
      background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--radius);
      box-shadow: var(--shadow); animation: rise .14s ease;
    }
    .slash-item {
      display: flex; gap: 10px; width: 100%; text-align: left;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
    }
    .slash-item:last-child { border-bottom: 0; }
    .slash-item.active, .slash-item:hover { background: var(--surface-3); }
    .slash-cmd { flex: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--accent); }
    .slash-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
    .slash-title { font-size: 13.5px; }
    .slash-desc { color: var(--faint); font-size: 12px; line-height: 1.45; }
    .status-list { max-height: min(56vh, 440px); overflow-y: auto; margin: 2px 0 10px; }
    .status-row { display: flex; gap: 12px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
    .status-row:last-child { border-bottom: 0; }
    .status-row .k { flex: none; width: 76px; color: var(--muted); }
    .status-row .v { min-width: 0; flex: 1; word-break: break-all; }
    .status-row .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .to-bottom {
      position: absolute; right: 16px; bottom: 84px; width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface-3); border: 1px solid var(--line-2); box-shadow: var(--shadow);
      display: grid; place-items: center; color: var(--muted); z-index: 12;
    }
    .to-bottom .new { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }

    /* ---------- 弹层、提示 ---------- */
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 40; animation: fade .16s ease; }
    @keyframes fade { from { opacity: 0; } }
    /* 整张 sheet 铺满全屏，但不吃指针事件：面板以外的点击落到遮罩上直接关闭。 */
    .sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
    .sheet-panel {
      width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 18px 18px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
      box-shadow: var(--shadow); animation: rise .2s ease; pointer-events: auto;
    }
    @keyframes rise { from { transform: translateY(16px); opacity: .4; } }
    .grabber { width: 38px; height: 4px; border-radius: 99px; background: var(--line-2); margin: 2px auto 12px; }
    .sheet-title { font-weight: 600; margin-bottom: 10px; }
    .field { display: block; margin-bottom: 12px; }
    .field > span { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; }
    .field select, .field input {
      width: 100%; height: 42px; padding: 0 10px; border-radius: 11px;
      background: var(--surface-2); border: 1px solid var(--line); outline: none;
    }
    .sheet-info { color: var(--faint); font-size: 12px; line-height: 1.7; margin-bottom: 8px; word-break: break-all; }
    .sheet-note { color: var(--faint); font-size: 11.5px; margin-bottom: 12px; }
    .sheet-close {
      width: 100%; height: 44px; border-radius: 12px; background: var(--accent); color: #08101c; font-weight: 600;
    }
    /* 运行中再次发送：选择把消息并入当前回合，还是排队等回合结束后发送。 */
    .sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .choice {
      display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    }
    .choice:hover { background: var(--surface-3); }
    .choice-title { display: block; font-weight: 600; font-size: 13.5px; }
    .choice-desc { display: block; color: var(--faint); font-size: 12px; line-height: 1.5; margin-top: 2px; }
    .sheet-close.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
    /* 会话导航：列出每个回合的用户输入，点击跳到对应位置。 */
    .nav-list { max-height: min(56vh, 440px); overflow-y: auto; margin: 2px 0 10px; }
    .nav-item {
      display: flex; gap: 10px; width: 100%; text-align: left; padding: 9px 6px;
      border-bottom: 1px solid var(--line); background: transparent; color: var(--text);
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item .n {
      flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3);
      color: var(--faint); font-size: 11.5px; display: grid; place-items: center;
    }
    .nav-body { min-width: 0; flex: 1; }
    .nav-text {
      font-size: 13.5px; line-height: 1.5; overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .nav-meta { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
    .toast-host { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast {
      pointer-events: auto; max-width: 88vw; padding: 9px 14px; border-radius: 12px; font-size: 13px;
      background: #2a3240; border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: rise .18s ease;
    }
    .toast.bad { background: #3a2226; border-color: rgba(248, 113, 113, .5); }

    /* ---------- 空状态与骨架 ---------- */
    .empty { color: var(--muted); text-align: center; padding: 34px 18px; font-size: 13.5px; }
    .empty .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
    .skeleton { border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: slide 1.3s linear infinite; height: 62px; margin: 6px 4px; }
    @keyframes slide { to { background-position: -200% 0; } }

    /* ---------- 令牌门 ---------- */
    .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: var(--bg); z-index: 70; }
    .gate-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
    .gate-card h2 { margin: 0 0 6px; font-size: 17px; }
    .gate-card p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .gate-card input { width: 100%; height: 44px; padding: 0 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); outline: none; }
    .gate-card button { width: 100%; height: 44px; margin-top: 12px; border-radius: 11px; background: var(--accent); color: #08101c; font-weight: 600; }
    .gate-card code { background: var(--surface-3); padding: 1px 5px; border-radius: 5px; font-size: 12px; }

    /* 进入会话后顶栏只留返回与刷新：品牌字样不再重复占位。 */
    .app[data-view="chat"] .logo, .app[data-view="chat"] .brand { display: none; }
    /* 连接状态只显示一处：列表页在顶栏，进入会话后移到输入框上方。 */
    .app[data-view="chat"] .status-top { display: none; }
    .app[data-view="list"] .connbar { display: none; }

    /* ---------- 响应式：手机上是「列表 ⇄ 对话」两屏 ---------- */
    @media (max-width: 860px) {
      body { font-size: 16px; }
      .composer textarea, .search input, .field select, .field input, .gate-card input { font-size: 16px; }
      .sidebar { position: absolute; inset: 0; width: 100%; border-right: 0; z-index: 20; }
      .back-btn { display: none; }
      .app[data-view="chat"] .back-btn { display: grid; }
      .app[data-view="chat"] .sidebar { display: none; }
      .app[data-view="list"] .chat { display: none; }
      .chip-btn { max-width: 44vw; }
      .chip-btn .k { display: none; }
      .transcript { padding: 12px 12px 4px; }
      .msg.user { max-width: 92%; }
      .to-bottom { bottom: 78px; right: 12px; }
    }
    @media (min-width: 861px) {
      .back-btn { display: none; }
      .sheet { align-items: center; }
      .sheet-panel { border-radius: 18px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
      .grabber { display: none; }
    }
    /* 宽屏时把正文收窄居中，和常见聊天网页一样保持行宽可读。 */
    @media (min-width: 1100px) {
      .transcript, .composer, .chat-head, .approval-host, .runbar, .connbar, .attach-bar, .queue-head, .queue-item {
        padding-left: max(14px, calc((100% - 860px) / 2));
        padding-right: max(14px, calc((100% - 860px) / 2));
      }
      .slash {
        left: max(14px, calc((100% - 860px) / 2));
        right: max(14px, calc((100% - 860px) / 2));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::after, *::before { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
<div class="app" id="app" data-view="list">
  <header class="topbar">

<script>
"use strict";

// 只有网页能给出合法决策的审批才展示；其余反向请求由桌面端应答。
const APPROVAL_METHODS = new Set([
  "item/commandExecution/requestApproval",
  "item/fileChange/requestApproval",
]);
const TOKEN_KEY = "codey_gateway_token";
const LAST_THREAD_KEY = "codey_gateway_last_thread";
// 网页只保留最近几个回合，翻到上限就不再往回取，避免长会话把正文堆满页面。
const TURNS_PAGE = 5;
const MAX_TURNS = 15;
// 网页可触发的斜杠命令，一一对应网关的命令白名单，不会把输入原样透传给上游。
const SLASH_COMMANDS = [
  { name: "compact", usage: "/compact", title: "压缩上下文", desc: "把较早的对话压成摘要，腾出上下文空间" },
  { name: "review", usage: "/review", title: "代码评审", desc: "评审工作区里还没有提交的改动" },
  { name: "rename", usage: "/rename", title: "重命名会话", desc: "修改当前会话的标题", arg: "新标题" },
  { name: "status", usage: "/status", title: "会话状态", desc: "查看模型、目录与累计用量" },
];

const state = {
  token: "",
  threads: [],
  models: [],
  threadId: null,
  detail: null,
  turns: [],
  nextCursor: null,
  activeTurnId: null,
  activeTurn: null,
  runTimer: null,
  runTicks: 0,
  autoScroll: true,
  live: new Map(),
  usage: { total: null, turns: {} },
  attachments: [],
  uploads: 0,
  attachSeq: 0,
  queue: [],
  approvals: [],
  reloadTimer: null,
  searchTimer: null,
  slashIndex: 0,
  slashMatches: [],
  command: null,
  commandTimer: null,
  loaded: false,
};

const $ = (id) => document.getElementById(id);
const isMobile = () => window.matchMedia("(max-width: 860px)").matches;

/* ================= 基础工具 ================= */

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function mono(text) {
  return el("span", "mono", text);
}

/* 手机上软键盘收起会把整个输入区往下挪：合成器在 touchend 时按新位置重新命中元素，
   click 就落到正文上而不是按钮上，「/」和命令项因此点了没反应。这里自己判定点按：
   pointerdown 记下按下位置，pointerup 仍在原处抬起才算数，与按钮有没有被挪走无关。
   键盘触发（detail 为 0 的 click）仍走原生路径，保证读屏与键盘可用。 */
const TAP_HANDLERS = new Map();

function onTap(selector, handler) {
  TAP_HANDLERS.set(selector, handler);
}

function tapTarget(node) {
  if (!node || typeof node.closest !== "function") return null;
  for (const selector of TAP_HANDLERS.keys()) {
    const target = node.closest(selector);
    if (target) return { selector, target };
  }
  return null;
}

let tapStart = null;

function bindTap() {
  document.addEventListener("pointerdown", (event) => {
    if (!event.isPrimary || (event.pointerType === "mouse" && event.button !== 0)) return;
    const hit = tapTarget(event.target);
    if (!hit) return;
    // 不把焦点交给按钮：输入框保持聚焦，软键盘就不会收起把按钮挪走。
    event.preventDefault();
    tapStart = {
      selector: hit.selector,
      node: hit.target,
      id: event.pointerId,
      x: event.clientX,
      y: event.clientY,
      at: Date.now(),
    };
  });
  window.addEventListener("pointerup", (event) => {
    const start = tapStart;
    tapStart = null;
    if (!start || event.pointerId !== start.id) return;
    if (Date.now() - start.at > 800) return;
    if (Math.abs(event.clientX - start.x) > 12 || Math.abs(event.clientY - start.y) > 12) return;
    const handler = TAP_HANDLERS.get(start.selector);
    if (handler) handler(start.node, event);
  });
  window.addEventListener("pointercancel", () => {
    tapStart = null;
  });
  document.addEventListener("click", (event) => {
    if (event.detail !== 0) return;
    const hit = tapTarget(event.target);
    if (!hit) return;
    const handler = TAP_HANDLERS.get(hit.selector);
    if (handler) handler(hit.target, event);
  });
}

function preview(text, limit) {
  const flat = String(text || "").replace(/\s+/g, " ").trim();
  const max = limit || 90;
  return flat.length > max ? flat.slice(0, max) + "…" : flat;
}

function json(value) {
  try { return JSON.stringify(value, null, 2); } catch { return String(value); }
}

function pad(value) {
  return value < 10 ? "0" + value : String(value);
}

function clock(date) {
  return pad(date.getHours()) + ":" + pad(date.getMinutes());
}

function sameDay(left, right) {
  return left.getFullYear() === right.getFullYear() && left.getMonth() === right.getMonth() && left.getDate() === right.getDate();
}

// 会话列表里的相对时间，和手机聊天应用的习惯一致。
function relTime(seconds) {
  if (!seconds) return "";
  const date = new Date(seconds * 1000);
  const now = new Date();
  const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (sameDay(date, now)) return "今天 " + clock(date);
  const yesterday = new Date(now.getTime() - 86400000);
  if (sameDay(date, yesterday)) return "昨天 " + clock(date);
  if (diff < 604800) return Math.floor(diff / 86400) + " 天前";
  return (date.getMonth() + 1) + "月" + date.getDate() + "日";
}

// 会话按工作目录归属到项目，网页和桌面端一样以项目分组；没有目录的归到「其他」。
function projectOf(thread) {
  const cwd = thread && thread.cwd ? String(thread.cwd).replace(/[\\/]+$/, "") : "";
  if (!cwd) return { key: "", name: "其他", path: "" };
  const name = cwd.split(/[\\/]/).pop() || cwd;
  return { key: cwd.toLowerCase(), name, path: cwd };
}

/* token 与耗时都来自 app-server 的回合数据与落盘用量，这里只做紧凑展示。 */
function formatTokens(value) {
  const count = Number(value);
  if (!Number.isFinite(count) || count <= 0) return "";
  if (count < 1000) return String(count);
  if (count < 1000000) return (count / 1000).toFixed(count < 10000 ? 1 : 0) + "k";
  return (count / 1000000).toFixed(2) + "M";
}

function formatDuration(ms) {
  const value = Number(ms);
  if (!Number.isFinite(value) || value <= 0) return "";
  const total = Math.round(value / 1000);
  if (total < 60) return total + " 秒";
  const minutes = Math.floor(total / 60);
  if (minutes < 60) return minutes + " 分 " + (total % 60) + " 秒";
  return Math.floor(minutes / 60) + " 小时 " + (minutes % 60) + " 分";
}

// 回合收尾统计：耗时、token 与思考次数都放在回合末尾；运行中的那份由输入框上方的状态条显示。
function turnStats(turn) {
  const parts = [];
  const duration = formatDuration(turn && turn.durationMs);
  if (duration) parts.push("耗时 " + duration);
  const usage = state.usage.turns[(turn && turn.id) || ""];
  const tokens = usage && formatTokens(usage.total_tokens);
  if (tokens) parts.push(tokens + " tokens");
  const thoughts = ((turn && turn.items) || []).filter((item) => item && item.type === "reasoning").length;
  if (thoughts) parts.push("思考 " + thoughts + " 次");
  return parts.join(" · ");
}

async function copyText(text, label) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.top = "-1000px";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    toast((label || "已复制") + "到剪贴板");
  } catch {
    toast("复制失败，请长按手动复制", "bad");
  }
}

function toast(message, kind) {
  const node = el("div", "toast" + (kind ? " " + kind : ""), message);
  node.addEventListener("click", () => node.remove());
  $("toastHost").appendChild(node);
  setTimeout(() => node.remove(), 4200);
}

function setStatus(text, kind) {
  $("statusText").textContent = text;
  $("statusPill").className = "status" + (kind ? " " + kind : "");
  // 列表页顶栏里的同一状态，两处一起更新；显示哪一处由当前视图的样式决定。
  $("statusTextTop").textContent = text;
  $("statusPillTop").className = "status status-top" + (kind ? " " + kind : "");
}

/* ================= 接口 ================= */

async function api(path, options) {
  const response = await fetch(path, {
    ...(options || {}),
    headers: {
      Authorization: "Bearer " + state.token,
      "Content-Type": "application/json",
      ...((options && options.headers) || {}),
    },
  });
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { error: { message: text } }; }
  if (response.status === 401) {
    sessionStorage.removeItem(TOKEN_KEY);
    showGate("访问令牌无效或不匹配，请粘贴控制台里的完整链接。");
    throw new Error("访问令牌无效");
  }
  if (!response.ok) {
    const error = body && body.error;
    throw new Error((error && (error.message || JSON.stringify(error))) || ("HTTP " + response.status));
  }
  return body;
}

/* ================= Markdown 渲染（只生成 DOM，不注入 HTML） ================= */

// 行内标记：粗斜体 / 粗体 / 斜体 / 删除线 / 行内代码 / 图片 / 链接 / 裸链接。
// 刻意不解析 _强调_，避免把 foo_bar 这类标识符拆成斜体。
const INLINE = /(\*\*\*[^*\n]+\*\*\*|\*\*[^*\n]+\*\*|~~[^~\n]+~~|`[^`\n]+`|!\[[^\]\n]*\]\([^)\s]+\)|\[[^\]\n]*\]\([^)\s]+\)|https?:\/\/[^\s<>()]+|\*[^*\n]+\*)/g;

/** 只放行常规协议，避免 javascript: 之类的链接。 */
function safeHref(url) {
  return /^(https?:|mailto:)/i.test(url) ? url : null;
}

function externalLink(label, url) {
  const href = safeHref(url);
  if (!href) return document.createTextNode(label || url);
  const link = el("a", "md-link", label || href);
  link.href = href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function renderInline(parent, text) {
  const value = String(text === undefined || text === null ? "" : text);
  let last = 0;
  let match;
  INLINE.lastIndex = 0;
  while ((match = INLINE.exec(value)) !== null) {
    if (match.index > last) parent.appendChild(document.createTextNode(value.slice(last, match.index)));
    const token = match[0];
    if (token.startsWith("***")) {
      const strong = el("strong");
      strong.appendChild(el("em", null, token.slice(3, -3)));
      parent.appendChild(strong);
    } else if (token.startsWith("**")) {
      parent.appendChild(el("strong", null, token.slice(2, -2)));
    } else if (token.startsWith("~~")) {
      parent.appendChild(el("span", "md-del", token.slice(2, -2)));
    } else if (token.startsWith("`")) {
      parent.appendChild(el("code", "md-code", token.slice(1, -1)));
    } else if (token.startsWith("![")) {
      const parts = /^!\[([^\]]*)\]\(([^)\s]+)\)$/.exec(token);
      const href = parts && safeHref(parts[2]);
      if (href) {
        const image = el("img", "md-img");
        image.src = href;
        image.alt = parts[1] || "";
        image.loading = "lazy";
        parent.appendChild(image);
      } else {
        parent.appendChild(document.createTextNode(token));
      }
    } else if (token.startsWith("[")) {
      const parts = /^\[([^\]]*)\]\(([^)\s]+)\)$/.exec(token);
      parent.appendChild(parts ? externalLink(parts[1], parts[2]) : document.createTextNode(token));
    } else if (token.startsWith("http")) {
      parent.appendChild(externalLink(token, token));
    } else {
      parent.appendChild(el("em", null, token.slice(1, -1)));
    }
    last = match.index + token.length;
  }
  if (last < value.length) parent.appendChild(document.createTextNode(value.slice(last)));
}

function codeBlock(language, code) {
  const wrap = el("div", "code-block");
  const head = el("div", "code-head");
  head.appendChild(el("span", null, language || "代码"));
  const copy = el("button", "copy", "复制");
  copy.type = "button";
  copy.addEventListener("click", () => copyText(code));
  head.appendChild(copy);
  wrap.appendChild(head);
  const pre = el("pre");
  pre.appendChild(el("code", null, code));
  wrap.appendChild(pre);
  return wrap;
}

const FENCE = /^\s*(```|~~~)\s*([A-Za-z0-9_+#.-]*)\s*$/;
const HEADING = /^(#{1,6})\s+(.*)$/;
const HR = /^\s*([-*_])\s*(?:\1\s*){2,}$/;
const BULLET = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const QUOTE = /^\s*>\s?/;
const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/;
const TASK = /^\[([ xX])\]\s+(.*)$/;

function splitRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
}

/** 解析一层列表；缩进更深的子项递归挂到当前条目下，返回 [节点, 下一行号]。 */
function parseList(lines, start) {
  const first = BULLET.exec(lines[start]);
  const root = el(/\d/.test(first[2]) ? "ol" : "ul", "md-list");
  const base = first[1].length;
  let index = start;
  let current = null;
  while (index < lines.length) {
    const hit = BULLET.exec(lines[index]);
    if (!hit) break;
    const indent = hit[1].length;
    if (indent < base) break;
    if (indent > base && current) {
      const nested = parseList(lines, index);
      current.appendChild(nested[0]);
      index = nested[1];
      continue;
    }
    current = el("li");
    const task = TASK.exec(hit[3]);
    if (task) {
      const label = el("label", "md-task");
      const box = el("input");
      box.type = "checkbox";
      box.disabled = true;
      box.checked = task[1].toLowerCase() === "x";
      label.appendChild(box);
      const span = el("span");
      renderInline(span, task[2]);
      label.appendChild(span);
      current.appendChild(label);
    } else {
      renderInline(current, hit[3]);
    }
    root.appendChild(current);
    index += 1;
  }
  return [root, index];
}

function renderMarkdown(parent, text) {
  const lines = String(text === undefined || text === null ? "" : text).replace(/\r\n?/g, "\n").split("\n");
  const paragraph = [];
  const flush = () => {
    if (!paragraph.length) return;
    const node = el("p", "md-p");
    renderInline(node, paragraph.join("\n"));
    parent.appendChild(node);
    paragraph.length = 0;
  };
  let index = 0;
  while (index < lines.length) {
    const line = lines[index];
    const fence = FENCE.exec(line);
    if (fence) {
      flush();
      const close = new RegExp("^\\s*" + fence[1] + "\\s*$");
      const body = [];
      index += 1;
      while (index < lines.length && !close.test(lines[index])) {
        body.push(lines[index]);
        index += 1;
      }
      index += 1;
      parent.appendChild(codeBlock(fence[2], body.join("\n")));
      continue;
    }
    if (HR.test(line)) {
      flush();
      parent.appendChild(el("hr", "md-hr"));
      index += 1;
      continue;
    }
    const heading = HEADING.exec(line);
    if (heading) {
      flush();
      const node = el("div", "md-h md-h" + heading[1].length);
      renderInline(node, heading[2]);
      parent.appendChild(node);
      index += 1;
      continue;
    }
    if (line.indexOf("|") >= 0 && index + 1 < lines.length && TABLE_SEP.test(lines[index + 1])) {
      flush();
      const table = el("table", "md-table");
      const thead = el("thead");
      const headRow = el("tr");
      for (const cell of splitRow(line)) {
        const th = el("th");
        renderInline(th, cell);
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = el("tbody");
      index += 2;
      while (index < lines.length && lines[index].trim() && lines[index].indexOf("|") >= 0) {
        const row = el("tr");
        for (const cell of splitRow(lines[index])) {
          const td = el("td");
          renderInline(td, cell);
          row.appendChild(td);
        }
        tbody.appendChild(row);
        index += 1;
      }
      table.appendChild(tbody);
      parent.appendChild(table);
      continue;
    }
    if (BULLET.test(line)) {
      flush();
      const parsed = parseList(lines, index);
      parent.appendChild(parsed[0]);
      index = parsed[1];
      continue;
    }
    if (QUOTE.test(line)) {
      flush();
      const quote = el("blockquote", "md-quote");
      while (index < lines.length && QUOTE.test(lines[index])) {
        const node = el("div");
        renderInline(node, lines[index].replace(QUOTE, ""));
        quote.appendChild(node);
        index += 1;
      }
      parent.appendChild(quote);
      continue;
    }
    if (!line.trim()) {
      flush();
      index += 1;
      continue;
    }
    paragraph.push(line);
    index += 1;
  }
  flush();
}

/** 流式输出：按帧节流重渲染整段 Markdown，避免逐字追加时用户看到未格式化的原文。 */
function renderLive(live) {
  if (live.frame) return;
  live.frame = requestAnimationFrame(() => {
    live.frame = 0;
    live.node.textContent = "";
    renderMarkdown(live.node, live.text);
  });
}

/* ================= 消息与工具卡片 ================= */

function agentMessage(text) {
  const node = el("div", "msg agent");
  renderMarkdown(node, text || "");
  return node;
}

function messageText(item) {
  const parts = [];
  for (const part of (item && item.content) || []) {
    if (part && part.type === "text" && part.text) parts.push(part.text);
    else if (part && part.type && !IMAGE_INPUT_TYPES.has(part.type)) parts.push("[" + part.type + "]");
  }
  return parts.join("\n");
}

// 用户消息里的图片输入在网页上只用张数表示。
const IMAGE_INPUT_TYPES = new Set(["image", "localImage"]);

function messageImageCount(item) {
  return ((item && item.content) || []).filter((part) => part && IMAGE_INPUT_TYPES.has(part.type)).length;
}

function userMessage(item) {
  const text = messageText(item);
  const node = el("div", "msg user");
  if (text) node.appendChild(el("div", "msg-text", text));
  const images = messageImageCount(item);
  if (images) node.appendChild(el("div", "msg-images", "图片 " + images + " 张"));
  if (!text) return node;
  const actions = el("div", "msg-actions");
  const copy = el("button", null, "复制");
  copy.type = "button";
  copy.addEventListener("click", () => copyText(text, "已复制消息"));
  const edit = el("button", null, "编辑");
  edit.type = "button";
  edit.addEventListener("click", () => editMessage(text));
  actions.appendChild(copy);
  actions.appendChild(edit);
  node.appendChild(actions);
  return node;
}

// 编辑把消息回填到输入框：历史仍保留，改完直接发送即可重新提问。
function editMessage(text) {
  const input = $("input");
  input.value = text;
  autoGrow();
  input.focus();
  try { input.setSelectionRange(text.length, text.length); } catch { /* 忽略 */ }
  toast("已填入输入框，修改后发送");
}

// 工具、命令、文件改动与图片都只留一行计数，和思考一样轻；正文与路径在网关侧已裁掉。
const TOOL_TYPES = new Set([
  "commandExecution", "mcpToolCall", "dynamicToolCall",
  "functionCallOutput", "webSearch", "collabAgentToolCall",
]);

function countNote(icon, text) {
  const node = el("div", "tool-note");
  node.appendChild(el("span", "icon", icon));
  node.appendChild(el("span", null, text));
  return node;
}

function toolGroup(items) {

}

// 文件改动只报数量：改了哪些文件、怎么改的都不再下发，也不再展示。
function fileBlock(items) {
  const count = items.reduce((sum, item) => sum + (Number(item.changeCount) || 0), 0);
  return countNote("±", "修改 " + count + " 个文件");
}

function imageGroup(items) {

function card(kind, title, chip) {
  const node = el("div", "card");
  const head = el("div", "card-head");

  head.appendChild(el("span", "title", title));

function copyButton(text) {
  const copy = el("button", "copy", "复制");
  copy.type = "button";
  copy.addEventListener("click", (event) => {
    // 复制按钮在 summary 里，点它不要顺带折叠卡片。

function rawBlock(label, text, open) {

  if (open) details.open = true;
  const summary = el("summary");
  summary.appendChild(el("span", "raw-label", label));
  summary.appendChild(copyButton(text));
  details.appendChild(summary);
  details.appendChild(el("pre", "card-pre", text));

}

function statusChip(status, exitCode) {
  const value = String(status || "").toLowerCase();
  const table = {
    completed: ["已完成", "ok"], success: ["已完成", "ok"],
    inprogress: ["运行中", "run"], running: ["运行中", "run"], active: ["运行中", "run"], pending: ["排队中", "run"],
    failed: ["失败", "bad"], error: ["失败", "bad"],
    interrupted: ["已中断", "warn"], cancelled: ["已中断", "warn"], canceled: ["已中断", "warn"], declined: ["已拒绝", "warn"],
  };
  const hit = table[value];
  if (!hit) {
    if (exitCode === null || exitCode === undefined) return null;
    return el("span", "chip " + (exitCode === 0 ? "ok" : "bad"), "exit " + exitCode);
  }
  const node = el("span", "chip " + hit[1]);
  if (hit[1] === "run") node.appendChild(el("i"));
  node.appendChild(el("span", null, hit[0]));
  return node;
}

function renderItem(item) {
  const type = item && item.type;
  if (type === "userMessage") return userMessage(item);
  if (type === "agentMessage") return agentMessage(item.text || "");
  if (type === "reasoning") return null;
  if (type === "commandExecution") {
    // 标题本来就会被 CSS 截成一行，先截好文案可以省掉超长命令的排版开销。
    const node = card("$", preview(item.command || "", 160), statusChip(item.status, item.exitCode));
    if (item.cwd) node.appendChild(el("div", "card-sub mono", item.cwd));
    // 输出正文在网关侧已截断成预览，这里只展示这一小段。
    const output = item.aggregatedOutput || "";
    if (output) node.appendChild(rawBlock("输出预览", output, String(item.status || "").toLowerCase().indexOf("fail") >= 0));
    return node;
  }
  // fileChange 由 fileBlock 合并展示，不在这里单独渲染。
  if (type === "mcpToolCall" || type === "dynamicToolCall") {
    // 参数与结果在网关侧已去掉，卡片只保留“调用了哪个工具”。
    const node = card("⚙", "MCP " + (item.server || "") + "." + (item.tool || ""), statusChip(item.status));
    if (item.error) node.appendChild(rawBlock("错误", typeof item.error === "string" ? item.error : json(item.error), false));
    return node;
  }
  if (type === "functionCallOutput") {
    const node = card("↳", "工具输出 · " + (item.name || ""));
    node.appendChild(rawBlock("输出预览", typeof item.output === "string" ? item.output : json(item.output), false));
    return node;
  }
  if (type === "plan") {
    const node = card("☰", "计划");
    const body = el("div", "card-pre");
    renderMarkdown(body, item.text || "");
    node.appendChild(body);
    return node;
  }
  if (type === "webSearch") {
    const node = card("⌕", "联网搜索 · " + (item.query || ""));
    return node;
  }
  if (type === "collabAgentToolCall") {
    const node = card("⧉", "子代理调用 · " + (item.tool || ""));
    if (item.prompt) node.appendChild(rawBlock("提示词", typeof item.prompt === "string" ? item.prompt : json(item.prompt), false));
    return node;
  }
  if (type === "subAgentActivity") {
    return card("⧉", "子代理活动 · " + (item.kind || ""), null);
  }
  if (type === "contextCompaction") return card("⤵", "上下文压缩", null);
  if (type === "enteredReviewMode" || type === "exitedReviewMode") {
    return card("◇", type === "enteredReviewMode" ? "进入评审模式" : "退出评审模式", null);
  }
  const node = card("•", type || "未知项");
  node.appendChild(rawBlock("原始数据", json(item), false));
  return node;
}

/* ================= 对话渲染 ================= */

function isPinned(root) {
  return root.scrollHeight - root.scrollTop - root.clientHeight < 70;
}

/**
 * 贴到底部。移动端浏览器有时会延迟结算滚动高度，赋值一次可能停在半路，
 * 因此重复到高度稳定为止。
 */
function pinToBottom(root) {
  let previous = -1;
  for (let i = 0; i < 6 && previous !== root.scrollHeight; i += 1) {
    previous = root.scrollHeight;
    root.scrollTop = root.scrollHeight;
    void root.scrollHeight;
  }
}

function scrollToBottom() {
  pinToBottom($("transcript"));
  $("toBottom").hidden = true;
  $("toBottom").querySelector(".new").hidden = true;
  state.autoScroll = true;
}

function updateToBottom() {
  const root = $("transcript");
  const show = root.scrollHeight - root.scrollTop - root.clientHeight > 120;
  $("toBottom").hidden = !show;
}

// 只有停在底部时才跟随新消息：滚上去看历史时不再被拽回底部，改由「回到最新」提示有新内容。
function updateAutoScroll() {
  state.autoScroll = isPinned($("transcript"));
  if (state.autoScroll) $("toBottom").querySelector(".new").hidden = true;
}

function updateAtBottom() {
  updateToBottom();
  updateAutoScroll();
}

/* ================= 运行状态条 ================= */

// 回合进行中把已用时、token 与思考次数贴在输入框上方；结束时这些数字落到回合末尾。
function startRun(turn) {
  const id = (turn && turn.id) || state.activeTurnId || null;
  const started = Number(turn && turn.startedAt);
  if (!state.activeTurn || (id && state.activeTurn.id !== id)) {
    state.activeTurn = {
      id,
      startedAt: Number.isFinite(started) && started > 0 ? started : Math.floor(Date.now() / 1000),
      reasonings: 0,
    };
  }
  state.activeTurnId = id;
  if (!state.runTimer) {
    state.runTicks = 0;
    state.runTimer = setInterval(runTick, 1000);
  }
  renderRunbar();
}

function runTick() {
  renderRunbar();
  state.runTicks += 1;
  // token 在回合进行中持续增长，隔几秒补一次；落盘聚合有成本，不要太频繁。
  if (state.runTicks % 8 === 0 && state.threadId) loadUsage(state.threadId, true).catch(() => {});
}

function endRun() {
  clearInterval(state.runTimer);
  state.runTimer = null;
  state.runTicks = 0;
  state.activeTurn = null;
  state.activeTurnId = null;
  renderRunbar();
}

function renderRunbar() {
  const bar = $("runbar");
  const turn = state.activeTurn;
  $("stopBtn").hidden = !state.activeTurnId;
  if (!turn && !state.command) {
    bar.hidden = true;
    bar.textContent = "";
    return;
  }
  bar.textContent = "";
  bar.appendChild(el("span", "run-dot"));
  const parts = [state.command ? state.command.title + "中" : "运行中"];
  if (turn) {
    const elapsed = Math.max(0, Math.floor(Date.now() / 1000) - turn.startedAt);
    parts.push(formatDuration(elapsed * 1000) || elapsed + " 秒");
    const tokens = state.usage.turns[turn.id] && formatTokens(state.usage.turns[turn.id].total_tokens);
    if (tokens) parts.push(tokens + " tokens");
    if (turn.reasonings) parts.push("思考 " + turn.reasonings + " 次");
  }
  bar.appendChild(el("span", "run-text", parts.join(" · ")));
  bar.hidden = false;
}

// 网页可能在回合开始后才打开：从已载入的回合里认领运行中的那条，状态条才有数据。
function adoptRunningTurn() {
  const running = state.turns.find((turn) => turn && turn.status === "inProgress");
  if (running) {
    const thoughts = (running.items || []).filter((item) => item && item.type === "reasoning").length;
    if (state.activeTurn && state.activeTurn.id === running.id) {
      state.activeTurn.reasonings = Math.max(state.activeTurn.reasonings, thoughts);
      state.activeTurnId = running.id;
    } else {
      startRun(running);
      state.activeTurn.reasonings = thoughts;
    }
    renderRunbar();
    return;
  }
  // 认领过的回合已经出现在列表里且已结束，说明完成事件没收到，兜底收起状态条。
  const mine = state.turns.find((turn) => turn && turn.id === state.activeTurnId);
  if (mine && mine.status && mine.status !== "inProgress") {
    endRun();
    renderChatHead();
  }
}

/* ================= 排队消息 ================= */

// 排队由上游维护（桌面端也在用同一份队列），网页只读列表并触发「插队立即执行 / 删除」。
function renderQueue() {
  const box = $("queueBox");
  const items = state.queue || [];
  box.textContent = "";
  if (!items.length) {
    box.hidden = true;
    return;
  }
  box.appendChild(el("div", "queue-head", "排队中 " + items.length + " 条"));
  items.forEach((item, index) => {
    const row = el("div", "queue-item");
    row.appendChild(el("span", "queue-text", index + 1 + ". " + (item.text || "（非文本消息）")));
    const actions = el("div", "queue-actions");
    const start = el("button", "queue-btn", "立即执行");
    start.type = "button";
    start.addEventListener("click", () => queueAction("start", item.id));
    const remove = el("button", "queue-btn danger", "删除");
    remove.type = "button";
    remove.addEventListener("click", () => queueAction("delete", item.id));
    actions.appendChild(start);
    actions.appendChild(remove);
    row.appendChild(actions);
    box.appendChild(row);
  });
  box.hidden = false;
}

async function loadQueue(id) {
  if (!id) return;
  const body = await api("/api/threads/" + encodeURIComponent(id) + "/queue");
  if (state.threadId !== id) return;
  state.queue = (body && body.items) || [];
  renderQueue();
}

async function queueAction(action, queuedSubmissionId) {
  if (!state.threadId || !queuedSubmissionId) return;
  try {
    const body = await api("/api/threads/" + encodeURIComponent(state.threadId) + "/queue", {
      method: "POST",
      body: JSON.stringify({ action, queuedSubmissionId }),
    });
    toast(action === "start" ? "已请求插队执行" : (body && body.deleted === false ? "这条排队消息已经不在了" : "已删除排队消息"));
    // 立即执行会另起回合，等上游的 turn/started 事件点亮状态条即可，这里只对齐队列列表。
    loadQueue(state.threadId).catch(() => {});
    scheduleReload(400);
  } catch (error) {
    reportError(error);
    loadQueue(state.threadId).catch(() => {});
  }
}

function renderTranscript(forceScroll) {
  const root = $("transcript");
  const pinned = forceScroll || isPinned(root);
  const keep = root.scrollTop;
  root.textContent = "";
  state.live.clear();
  if (!state.threadId) {
    const empty = el("div", "empty");
    empty.appendChild(el("div", "big", "选择一个对话"));
    empty.appendChild(el("div", null, isMobile() ? "点左上角返回列表，选择一个会话开始。" : "左侧列出本机全部对话，包含桌面端没有打开的会话。"));
    root.appendChild(empty);
    updateAtBottom();
    return;
  }
  if (!state.turns.length) {
    root.appendChild(el("div", "empty", "这个会话还没有消息。"));
  }
  if (state.nextCursor) {
    const more = el("button", "more-btn", "加载更早的消息");
    more.type = "button";
    more.addEventListener("click", () => loadTurns(state.nextCursor).catch(reportError));
    root.appendChild(more);
  } else if (state.turns.length >= MAX_TURNS) {
    root.appendChild(el("div", "more-hint", "仅显示最近 " + MAX_TURNS + " 个回合"));
  }
  const ordered = state.turns.slice().reverse();
  for (const turn of ordered) {
    const node = el("div", "turn");
    node.id = "turn-" + turn.id;
    const head = el("div", "turn-head");
    const stamp = turn.createdAt || turn.startedAt || turn.completedAt;
    head.appendChild(el("span", null, stamp ? relTime(stamp) : "回合"));
    head.appendChild(el("span", "line"));
    const chip = statusChip(turn.status, null);
    if (chip) head.appendChild(chip);
    node.appendChild(head);
    // 连续的同类条目合并成一行计数：工具与命令、文件改动、图片各自只留一条。
    let run = [];
    let runKind = null;
    const flushRun = () => {
      if (!run.length) return;
      const render = runKind === "files" ? fileBlock : runKind === "images" ? imageGroup : toolGroup;
      node.appendChild(render(run));
      run = [];
      runKind = null;
    };
    const pushRun = (item, kind) => {
      if (runKind !== kind) flushRun();
      runKind = kind;
      run.push(item);
    };
    for (const item of turn.items || []) {
      if (!item) continue;
      // 思考正文与步数都不在这里展开，次数统一放在回合末尾的统计里。
      if (item.type === "reasoning") continue;
      if (TOOL_TYPES.has(item.type)) { pushRun(item, "tools"); continue; }
      if (item.type === "fileChange") { pushRun(item, "files"); continue; }
      if (item.type === "imageView" || item.type === "imageGeneration") { pushRun(item, "images"); continue; }
      flushRun();
      const rendered = renderItem(item);
      if (rendered) node.appendChild(rendered);
    }
    flushRun();
    // 回合结束后才在末尾补统计；运行中的那份由输入框上方的状态条实时显示。
    if (turn.status !== "inProgress") {
      const stats = turnStats(turn);
      if (stats) node.appendChild(el("div", "turn-foot", stats));
    }
    root.appendChild(node);
  }
  if (pinned) pinToBottom(root);
  else root.scrollTop = keep;
  updateAtBottom();
}

function renderThreads() {
  const root = $("threads");
  root.textContent = "";
  $("threadCount").textContent = state.threads.length ? state.threads.length + " 个会话" : "";
  if (!state.loaded) {
    for (let index = 0; index < 6; index += 1) root.appendChild(el("div", "skeleton"));
    return;
  }
  if (!state.threads.length) {
    root.appendChild(el("div", "empty", "没有匹配的对话"));
    return;
  }
  // 上游按最近使用返回，因此项目组的先后就是各项目最近一次会话的先后，组内也已经是最近在前。
  const groups = new Map();
  for (const thread of state.threads) {
    const project = projectOf(thread);
    const entry = groups.get(project.key) || { name: project.name, path: project.path, threads: [] };
    entry.threads.push(thread);
    groups.set(project.key, entry);
  }
  for (const entry of groups.values()) {
    const label = el("div", "group-label");
    label.appendChild(el("span", "group-name", entry.name));
    label.appendChild(el("span", "group-count", entry.threads.length + " 个会话"));
    if (entry.path) label.title = entry.path;
    root.appendChild(label);
    for (const thread of entry.threads) {
      const running = !!(thread.status && thread.status.type === "active");
      const node = el("div", "thread" + (thread.id === state.threadId ? " active" : ""));
      const top = el("div", "t-top");
      top.appendChild(el("span", "t-name", thread.name || preview(thread.preview) || "(未命名)"));
      if (running) {
        const badge = el("span", "run-badge");
        badge.appendChild(el("i"));
        badge.appendChild(el("span", null, "运行中"));
        top.appendChild(badge);
      }
      node.appendChild(top);
      const line = preview(thread.preview);
      if (line && line !== thread.name) node.appendChild(el("div", "t-prev", line));
      const meta = el("div", "t-meta");
      if (thread.model) {
        meta.appendChild(el("span", null, thread.model));
        meta.appendChild(el("span", "sep", "·"));
      }
      meta.appendChild(el("span", null, relTime(thread.updatedAt)));
      node.appendChild(meta);
      node.addEventListener("click", () => openThread(thread.id).catch(reportError));
      root.appendChild(node);
    }
  }
}

function renderChatHead() {
  const thread = (state.detail && state.detail.thread) || null;
  $("chatTitle").textContent = thread ? (thread.name || preview(thread.preview) || state.threadId || "对话") : "选择一个对话";
  const meta = [];
  if (thread) {
    if (thread.cwd) meta.push(thread.cwd);
    if (state.detail.model) meta.push(state.detail.model);
    if (state.command) meta.push(state.command.title + "中");
    else if (state.activeTurnId) meta.push("运行中");
    const total = formatTokens(state.usage.total && state.usage.total.total_tokens);
    if (total) meta.push("累计 " + total + " tokens");
  }
  $("chatMeta").textContent = meta.join(" · ");
  renderContextRing();
}

// 上下文用量：分子是最近一次请求的真实占用，分母是模型窗口，都来自落盘用量；
// 缺任一项就整块隐藏，不显示一个没有依据的百分比。
const CTX_CIRCUMFERENCE = 2 * Math.PI * 15.5;

function contextInfo() {
  const context = state.usage.context;
  const used = Number(context && context.used);
  const window = Number(context && context.window);
  if (!Number.isFinite(used) || !Number.isFinite(window) || used <= 0 || window <= 0) return null;
  const ratio = Math.max(0, Math.min(1, used / window));
  const percent = Math.round(ratio * 100);
  return {
    used,
    window,
    ratio,
    percent,
    label: "上下文已用 " + formatTokens(used) + " / " + formatTokens(window) + "（" + percent + "%）",
  };
}

function renderContextRing() {
  const ring = $("ctxRing");
  const info = contextInfo();
  if (!info) {
    ring.hidden = true;
    ring.removeAttribute("title");
    ring.removeAttribute("aria-label");
    return;
  }
  ring.hidden = false;
  ring.classList.toggle("warn", info.ratio >= 0.85);
  ring.querySelector(".ctx-fill").style.strokeDashoffset = String(CTX_CIRCUMFERENCE * (1 - info.ratio));
  $("ctxPct").textContent = info.percent + "%";
  ring.title = info.label;
  ring.setAttribute("aria-label", info.label);
}

function updateModelChip() {
  const model = currentModel();
  const name = (state.detail && state.detail.model) || (model && (model.displayName || model.id)) || "跟随会话";
  const effort = $("effort").value;
  $("modelChipText").textContent = effort ? name + " · " + effort : name;
}

/* ================= 模型与强度 ================= */

function renderModels() {
  const select = $("model");
  select.textContent = "";
  const blank = el("option", null, "（跟随会话）");
  blank.value = "";
  select.appendChild(blank);
  for (const model of state.models) {
    const option = el("option", null, String(model.displayName || model.id || model.model || ""));
    option.value = model.id || model.model || "";
    select.appendChild(option);
  }
  select.value = (state.detail && state.detail.model) || "";
  renderEfforts();
}

function currentModel() {
  const id = $("model").value;
  return state.models.find((model) => (model.id || model.model) === id) || null;
}

function renderEfforts() {
  const select = $("effort");
  select.textContent = "";
  const blank = el("option", null, "（默认强度）");
  blank.value = "";
  select.appendChild(blank);
  const model = currentModel();
  for (const option of (model && model.supportedReasoningEfforts) || []) {
    const value = option.reasoningEffort || option;
    const node = el("option", null, String(value));
    node.value = value;
    if (option.description) node.title = option.description;
    select.appendChild(node);
  }
  select.value = (state.detail && state.detail.reasoningEffort) || "";
  updateModelChip();
}

function openSheet() {
  const info = $("sheetInfo");
  info.textContent = "";
  if (state.threadId) {
    info.appendChild(el("div", null, "会话：" + (state.threadId || "")));
    if (state.detail && state.detail.cwd) info.appendChild(el("div", null, "工作目录：" + state.detail.cwd));
  } else {
    info.appendChild(el("div", null, "先打开一个会话，再选择模型与推理强度。"));
  }
  $("model").disabled = !state.threadId;
  $("effort").disabled = !state.threadId;
  $("overlay").hidden = false;
  $("sheet").hidden = false;
}

function closeSheet() {
  $("overlay").hidden = true;
  $("sheet").hidden = true;
}

/* ================= 会话导航 ================= */

// 取回合里第一条有正文的用户消息，用于导航项的标题。
function turnUserText(turn) {
  for (const item of (turn && turn.items) || []) {
    if (!item || item.type !== "userMessage") continue;
    const parts = [];
    for (const part of item.content || []) {
      if (part && part.type === "text" && part.text) parts.push(part.text);
    }
    const text = parts.join(" ").replace(/\s+/g, " ").trim();
    if (text) return text;
  }
  return "";
}

function openNav() {
  const list = $("navList");
  list.textContent = "";
  // 从最早到最新排列，序号即回合顺序；只列有用户输入的回合。
  const entries = state.turns
    .slice()
    .reverse()
    .map((turn) => ({ turn, text: turnUserText(turn) }))
    .filter((entry) => entry.text);
  if (!entries.length) {
    list.appendChild(el("div", "empty", "还没有可跳转的回合。"));
  }
  entries.forEach((entry, index) => {
    const turn = entry.turn;
    const item = el("button", "nav-item");
    item.type = "button";
    item.appendChild(el("span", "n", String(index + 1)));
    const body = el("div", "nav-body");
    body.appendChild(el("div", "nav-text", preview(entry.text, 140)));
    const meta = [];
    const stamp = turn.completedAt || turn.startedAt || turn.createdAt;
    if (stamp) meta.push(relTime(stamp));
    const duration = formatDuration(turn.durationMs);
    if (duration) meta.push(duration);
    if (meta.length) body.appendChild(el("div", "nav-meta", meta.join(" · ")));
    item.appendChild(body);
    item.addEventListener("click", () => {
      closeNav();
      scrollToTurn(turn.id);
    });
    list.appendChild(item);
  });
  $("navOverlay").hidden = false;
  $("navSheet").hidden = false;
}

function closeNav() {
  $("navOverlay").hidden = true;
  $("navSheet").hidden = true;
}

function scrollToTurn(id) {
  const node = document.getElementById("turn-" + id);
  if (!node) return;
  node.scrollIntoView({ block: "start", behavior: "smooth" });
  node.classList.add("flash");
  setTimeout(() => node.classList.remove("flash"), 1200);
}

/* ================= 数据加载 ================= */

function reportError(error) {
  const message = error && error.message ? error.message : String(error);
  toast(message, "bad");
}

async function loadThreads() {
  const search = $("search").value.trim();
  const query = search ? "?search=" + encodeURIComponent(search) : "";
  const body = await api("/api/threads" + query);
  state.threads = body.threads || [];
  state.loaded = true;
  renderThreads();
}

async function loadModels() {
  const body = await api("/api/models");
  state.models = body.models || [];
  renderModels();
}

async function loadTurns(cursor) {
  // 记下请求发出时的会话：响应回来时用户可能已经切走，那份数据不能再写进当前视图，
  // 否则上一个会话里运行中的回合会被当场认领，状态条就挂到别的会话上了。
  const id = state.threadId;
  const query = "?limit=" + TURNS_PAGE + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
  const body = await api("/api/threads/" + encodeURIComponent(id) + "/turns" + query);
  if (state.threadId !== id) return;
  const turns = body.turns || [];
  if (cursor) {
    const room = Math.max(0, MAX_TURNS - state.turns.length);
    state.turns = state.turns.concat(turns.slice(0, room));
  } else {
    state.turns = turns.slice(0, MAX_TURNS);
  }
  state.nextCursor = state.turns.length >= MAX_TURNS ? null : (body.nextCursor || null);
  // 不强制回到底部：只有用户本来就停在底部时才跟随，翻历史时不会被拽下去。
  renderTranscript(false);
  adoptRunningTurn();
}

// 用量单独懒加载：网关要扫盘聚合，先渲染正文再补 token，不拖慢会话打开。
// keepScroll 为真时只更新状态条与回合统计，不重排正文，避免定时刷新把页面滚到底部。
async function loadUsage(id, keepScroll) {
  const usage = await api("/api/threads/" + encodeURIComponent(id) + "/usage");
  if (state.threadId !== id || !usage || typeof usage !== "object") return;
  state.usage = { total: usage.total || null, turns: usage.turns || {}, context: usage.context || null };
  renderChatHead();
  renderRunbar();
  // 运行中的回合靠事件流增量渲染，重排会打断它，等回合结束再补上用量。
  if (!keepScroll && !state.live.size) renderTranscript(false);
}

function showListView() {
  $("app").dataset.view = "list";
}

function showChatView() {
  $("app").dataset.view = "chat";
}

async function openThread(id) {
  if (state.threadId && state.threadId !== id) closeThread(state.threadId);
  endRun();
  state.threadId = id;
  state.detail = null;
  state.turns = [];
  state.nextCursor = null;
  state.activeTurnId = null;
  state.autoScroll = true;
  state.live.clear();
  state.usage = { total: null, turns: {}, context: null };
  state.attachments = [];
  state.queue = [];
  state.approvals = [];
  clearCommand();
  closeSlash();
  cancelSendMode();
  state.slashIndex = 0;
  renderApprovals();
  renderQueue();
  renderAttachBar();
  try { localStorage.setItem(LAST_THREAD_KEY, id); } catch { /* 隐私模式下忽略 */ }
  $("chatTitle").textContent = "载入中…";
  $("chatMeta").textContent = "";
  $("transcript").textContent = "";
  renderThreads();
  renderTranscript(true);
  // 打开会话后顶栏只留返回与刷新；手机上这个状态还负责「列表 ⇄ 对话」两屏切换。
  showChatView();
  if (isMobile()) {
    try { history.pushState({ view: "chat", id }, ""); } catch { /* 忽略 */ }
  }
  const detail = await api("/api/threads/" + encodeURIComponent(id));
  // 切会话时上一个请求可能才返回：晚到的响应一律丢弃，否则会把旧会话的内容写进当前视图。
  if (state.threadId !== id) return;
  state.detail = detail;
  renderChatHead();
  renderModels();
  updateModelChip();
  await loadTurns(null);
  if (state.threadId !== id) return;
  updateAtBottom();
  loadUsage(id).catch(() => {});
  loadQueue(id).catch(() => {});
}

function closeThread(id) {
  try {
    navigator.sendBeacon("/api/threads/" + encodeURIComponent(id) + "/close?token=" + encodeURIComponent(state.token));
  } catch { /* 关闭失败不影响切换 */ }
}

/* ================= 动作 ================= */

/* ---------- 斜杠命令 ---------- */

// 只有「/」开头且还没输入空格的片段才算命令名补全；`/rename 标题` 这类整串交给提交处理。
function slashMatches(text) {
  const match = /^\/([a-zA-Z]*)$/.exec(text);
  if (!match) return [];
  const keyword = match[1].toLowerCase();
  return SLASH_COMMANDS.filter((cmd) => !keyword || cmd.name.indexOf(keyword) === 0);
}

function slashVisible() {
  return !$("slashPanel").hidden;
}

function closeSlash() {
  if (!slashVisible()) return;
  $("slashPanel").hidden = true;
  // 「/」按钮补出来的空命令在收起面板时一起清掉，免得误发一条只有斜杠的消息。
  if ($("input").value.trim() === "/") {
    $("input").value = "";
    autoGrow();
  }
}

function renderSlash(matches) {
  const panel = $("slashPanel");
  const list = $("slashList");
  state.slashMatches = matches;
  list.textContent = "";
  if (!matches.length) {
    panel.hidden = true;
    return;
  }
  state.slashIndex = Math.max(0, Math.min(state.slashIndex, matches.length - 1));
  matches.forEach((cmd, index) => {
    const item = el("button", "slash-item" + (index === state.slashIndex ? " active" : ""));
    item.type = "button";
    item.setAttribute("role", "option");
    item.appendChild(el("span", "slash-cmd", cmd.usage));
    const body = el("span", "slash-body");
    body.appendChild(el("span", "slash-title", cmd.title));
    body.appendChild(el("span", "slash-desc", cmd.desc));
    item.appendChild(body);
    // 命令由统一的点按分发执行，不在这里挂 click：手机上那一次 click 常常落不到按钮上。
    item.dataset.index = String(index);
    list.appendChild(item);
  });
  panel.hidden = false;
}

// 命令面板只由「/」按钮打开：输入框里敲出 / 不再自动弹出，面板已打开时才按输入过滤。
function updateSlash() {
  if (!slashVisible()) return;
  if (!state.threadId) {
    closeSlash();
    return;
  }
  const matches = slashMatches($("input").value.trim());
  if (!matches.length) {
    closeSlash();
    return;
  }
  renderSlash(matches);
}

// 输入框右侧的「/」按钮是命令面板的唯一入口，和输入框里已有内容无关：
// 空输入时补一个斜杠方便接着过滤，已有草稿时原样保留并列出全部命令。
function toggleSlash() {
  const input = $("input");
  if (slashVisible()) {
    closeSlash();
    return;
  }
  if (!state.threadId) return;
  const text = input.value.trim();
  if (!text) {
    input.value = "/";
    autoGrow();
  }
  input.focus();
  state.slashIndex = 0;
  const matches = slashMatches(input.value.trim());
  renderSlash(matches.length ? matches : SLASH_COMMANDS);
}

function parseSlashCommand(text) {
  const match = /^\/([a-zA-Z]+)(?:\s+([\s\S]*))?$/.exec(text);
  if (!match) return null;
  return {
    cmd: SLASH_COMMANDS.find((item) => item.name === match[1].toLowerCase()) || null,
    arg: (match[2] || "").trim(),
  };
}

// 已知命令（含 `/rename 标题` 这种带参数写法）直接执行；命令名只输入了一半时回车
// 执行面板里高亮的那条；其余一律按普通消息发送，不把以 `/` 开头的正文挡下来。
function submitInput() {
  const input = $("input");
  const text = input.value.trim();
  // 只发图片、不带文字也是一条合法消息。
  if ((!text && !attachmentPaths().length) || !state.threadId) return;
  if (attachmentsPending()) {
    toast("图片还在上传，请稍候", "warn");
    return;
  }
  if (text.charAt(0) === "/") {
    const parsed = parseSlashCommand(text);
    if (parsed && parsed.cmd) {
      runCommand(parsed.cmd, parsed.arg);
      return;
    }
    if (slashVisible()) {
      const matches = slashMatches(text);
      const cmd = matches[state.slashIndex] || matches[0];
      if (cmd) {
        runCommand(cmd, "");
        return;
      }
    }
  }
  // 走到这里就是普通消息，命令面板不再需要，先收起来避免挡着新内容。
  closeSlash();
  if (state.command) {
    toast("正在" + state.command.title + "，请稍候", "warn");
    return;
  }
  // 回合运行中：先让用户选引导还是排队，选完再投递。
  if (state.activeTurnId) {
    openSendMode(text);
    return;
  }
  send(text, "start");
}

async function runCommand(cmd, arg) {
  if (!state.threadId) return;
  const input = $("input");
  // 输入框里已有普通草稿时不清空它：立即执行的命令跑完草稿还在，需要参数的命令
  // 只提示用法，等用户自己空出输入框再选一次，避免误触丢掉正在写的内容。
  const draft = input.value.trim();
  const onlyCommand = !draft || draft.charAt(0) === "/";
  // 需要参数的命令先补全用法，等用户填完再回车执行。
  if (cmd.arg && !arg) {
    if (!onlyCommand) {
      closeSlash();
      input.focus();
      toast("用法：" + cmd.usage + " " + cmd.arg);
      return;
    }
    input.value = cmd.usage + " ";
    autoGrow();
    closeSlash();
    input.focus();
    toast("用法：" + cmd.usage + " " + cmd.arg);
    return;
  }
  // 状态只在网页本地汇总，不受正在运行的命令影响。
  if (cmd.name === "status") {
    if (onlyCommand) {
      input.value = "";
      autoGrow();
    }
    closeSlash();
    openStatus();
    return;
  }
  if (state.command) {
    toast("正在" + state.command.title + "，请稍候", "warn");
    return;
  }
  if (onlyCommand) {
    input.value = "";
    autoGrow();
  }
  closeSlash();
  const payload = { command: cmd.name };
  if (cmd.arg) payload.name = arg;
  try {
    const body = await api("/api/threads/" + encodeURIComponent(state.threadId) + "/command", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    if (cmd.name === "rename") {
      const name = body.name || arg;
      if (state.detail && state.detail.thread) state.detail.thread.name = name;
      const hit = state.threads.find((thread) => thread.id === state.threadId);
      if (hit) hit.name = name;
      renderChatHead();
      renderThreads();
      toast("已重命名为「" + name + "」");
      return;
    }
    // 压缩与评审都会另起一个不可打断的回合，期间只提示状态，避免继续发送被上游拒绝。
    setCommand(cmd);
    startRun(body.turn);
    toast(cmd.name === "compact" ? "已开始压缩上下文" : "已开始代码评审");
    scheduleReload(600);
  } catch (error) {
    reportError(error);
  }
}

function setCommand(cmd) {
  clearTimeout(state.commandTimer);
  state.command = cmd;
  state.commandTimer = setTimeout(clearCommand, 180000);
  renderComposerState();
}

function clearCommand() {
  if (!state.command) return;
  clearTimeout(state.commandTimer);
  state.commandTimer = null;
  state.command = null;
  renderComposerState();
}

function renderComposerState() {
  const busy = !!state.command;
  $("sendBtn").disabled = busy || attachmentsPending();
  $("input").placeholder = busy ? state.command.title + "中…" : "输入消息…";
  renderChatHead();
}

/* ---------- 会话状态 ---------- */

function statusRows() {
  const thread = (state.detail && state.detail.thread) || {};
  const total = formatTokens(state.usage.total && state.usage.total.total_tokens);
  const context = contextInfo();
  return [
    ["标题", thread.name || preview(thread.preview) || "（未命名）"],
    ["会话 ID", state.threadId || "—", true],
    ["模型", (state.detail && state.detail.model) || "跟随会话"],
    ["推理强度", $("effort").value || "默认"],
    ["工作目录", thread.cwd || "—", true],
    ["累计用量", total ? total + " tokens" : "—"],
    ["上下文用量", context ? formatTokens(context.used) + " / " + formatTokens(context.window) + "（" + context.percent + "%）" : "—"],
    ["已载入回合", state.turns.length + " 个"],
    ["运行状态", state.command ? state.command.title + "中" : (state.activeTurnId ? "运行中" : "空闲")],
  ];
}

function openStatus() {
  const root = $("statusList");
  root.textContent = "";
  for (const [key, value, mono] of statusRows()) {
    const row = el("div", "status-row");
    row.appendChild(el("span", "k", key));
    row.appendChild(el("span", "v" + (mono ? " mono" : ""), String(value)));
    root.appendChild(row);
  }
  $("statusOverlay").hidden = false;
  $("statusSheet").hidden = false;
}

function closeStatus() {
  $("statusOverlay").hidden = true;
  $("statusSheet").hidden = true;
}

/* ---------- 运行中发送方式 ---------- */

// 回合正在运行时，先把消息存下来，让用户选择引导还是排队，选完再真正投递。
let pendingSend = null;

function openSendMode(text) {
  pendingSend = text;
  closeSlash();
  // 收起软键盘，避免移动端面板被输入法挡住；消息留在输入框里，取消后还能接着编辑。
  $("input").blur();
  $("sendModeOverlay").hidden = false;
  $("sendModeSheet").hidden = false;
}

function hideSendMode() {
  $("sendModeOverlay").hidden = true;
  $("sendModeSheet").hidden = true;
}

// 取消时把消息留在输入框里，用户能继续编辑后再发。
function cancelSendMode() {
  pendingSend = null;
  hideSendMode();
}

function chooseSendMode(mode) {
  const text = pendingSend;
  pendingSend = null;
  hideSendMode();
  // 空文本也可能是合法的「只发图片」消息，所以只按 null 判断取消。
  if (text !== null) send(text, mode);
}

async function send(text, mode) {
  const images = attachmentPaths();
  if ((!text && !images.length) || !state.threadId) return;
  if (state.command) {
    toast("正在" + state.command.title + "，请稍候", "warn");
    return;
  }
  if (attachmentsPending()) {
    toast("图片还在上传，请稍候", "warn");
    return;
  }
  const input = $("input");
  // 发送失败时把草稿与图片一起还回来，用户不用重新选一遍。
  const draft = state.attachments.slice();
  input.value = "";
  autoGrow();
  closeSlash();
  clearAttachments();
  try {
    const payload = { text, model: $("model").value || null, effort: $("effort").value || null };
    if (images.length) payload.images = images;
    // 运行中的回合：引导并入当前回合，排队交给上游在本回合结束后执行，都不新起回合。
    if (mode === "steer" || mode === "queue") {
      payload.mode = mode;
      if (mode === "steer") payload.turnId = state.activeTurnId;
    }
    const body = await api("/api/threads/" + encodeURIComponent(state.threadId) + "/messages", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    // 自己发出的消息一定跟到底部。
    state.autoScroll = true;
    if (mode === "steer") {
      toast("已引导当前回合");
      scheduleReload(500);
      return;
    }
    if (mode === "queue") {
      toast("已排队，等当前回合结束后发送");
      loadQueue(state.threadId).catch(() => {});
      scheduleReload(600);
      return;
    }
    // 新回合开启状态条统计。
    startRun(body.turn);
    scheduleReload(500);
  } catch (error) {
    input.value = text;
    state.attachments = draft;
    renderAttachBar();
    renderComposerState();
    autoGrow();
    reportError(error);
  }
}

async function stop() {
  if (!state.threadId || !state.activeTurnId) return;
  try {
    await api("/api/threads/" + encodeURIComponent(state.threadId) + "/interrupt", {
      method: "POST",
      body: JSON.stringify({ turnId: state.activeTurnId }),
    });
    toast("已请求停止");
  } catch (error) {
    reportError(error);
  }
}

function scheduleReload(delay) {
  clearTimeout(state.reloadTimer);
  state.reloadTimer = setTimeout(() => {
    if (state.threadId) loadTurns(null).catch(() => {});
  }, delay);
}

function autoGrow() {
  const input = $("input");
  input.style.height = "auto";
  const viewport = window.visualViewport;
  const limit = Math.round(((viewport && viewport.height) || window.innerHeight) * 0.4);
  input.style.height = Math.min(input.scrollHeight, limit) + "px";
}

/* ================= 图片输入 ================= */

// 网关的请求体上限是 2 MiB，Base64 会再放大三分之一，所以单张限制在 1.4 MiB 以内。
const ATTACH_MAX_BYTES = 1.4 * 1024 * 1024;
const ATTACH_MAX_COUNT = 4;

// 图片先在网页侧预览，再由网关落盘换成路径；上传完成前不允许发送，避免漏图。
function renderAttachBar() {
  const bar = $("attachBar");
  bar.textContent = "";
  if (!state.attachments.length) {
    bar.hidden = true;
    return;
  }
  for (const item of state.attachments) {
    const thumb = el("div", "attach-thumb" + (item.path ? "" : " pending"));
    if (item.path) {
      const image = el("img");
      image.src = item.dataUrl;
      image.alt = item.name || "待发送的图片";
      thumb.appendChild(image);
    } else {
      thumb.appendChild(el("span", null, "上传中"));
    }
    const remove = el("button", "attach-remove", "×");
    remove.type = "button";
    remove.setAttribute("aria-label", "移除这张图片");
    remove.dataset.id = item.id;
    thumb.appendChild(remove);
    bar.appendChild(thumb);
  }
  bar.hidden = false;
}

function removeAttachment(id) {
  state.attachments = state.attachments.filter((item) => item.id !== id);
  renderAttachBar();
  renderComposerState();
}

function clearAttachments() {
  state.attachments = [];
  renderAttachBar();
}

function attachmentsPending() {
  return state.uploads > 0 || state.attachments.some((item) => !item.path);
}

function attachmentPaths() {
  return state.attachments.filter((item) => item.path).map((item) => item.path);
}

function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("读取图片失败"));
    reader.readAsDataURL(file);
  });
}

async function addImages(files) {
  const list = Array.from(files || []);
  $("fileInput").value = "";
  const threadId = state.threadId;
  if (!list.length || !threadId) return;
  for (const file of list) {
    if (state.attachments.length + state.uploads >= ATTACH_MAX_COUNT) {
      toast("一条消息最多 " + ATTACH_MAX_COUNT + " 张图片", "warn");
      return;
    }
    if (!/^image\//.test(file.type || "")) {
      toast("只能发送图片文件", "warn");
      continue;
    }
    if (file.size > ATTACH_MAX_BYTES) {
      toast((file.name || "这张图片") + " 超过 1.4 MB，请先压缩", "bad");
      continue;
    }
    const id = String(++state.attachSeq);
    state.uploads += 1;
    state.attachments.push({ id, name: file.name, dataUrl: "", path: "" });
    renderAttachBar();
    renderComposerState();
    try {
      const dataUrl = await readImage(file);
      const body = await api("/api/threads/" + encodeURIComponent(threadId) + "/images", {
        method: "POST",
        body: JSON.stringify({ name: file.name, dataUrl }),
      });
      // 上传期间可能已经切走，这时结果直接丢弃，不再挂到新会话上。
      if (state.threadId !== threadId) return;
      if (!body || !body.path) throw new Error("图片上传失败");
      const item = state.attachments.find((entry) => entry.id === id);
      if (item) {
        item.dataUrl = dataUrl;
        item.path = body.path;
      }
    } catch (error) {
      if (state.threadId === threadId) {
        state.attachments = state.attachments.filter((entry) => entry.id !== id);
        reportError(error);
      }
    } finally {
      state.uploads -= 1;
      renderAttachBar();
      renderComposerState();
    }
  }
}

/* ================= 审批 ================= */

function renderApprovals() {
  const host = $("approvalHost");
  host.textContent = "";
  const head = state.approvals[0];
  if (!head) return;
  const label = head.method === "item/fileChange/requestApproval" ? "请求修改文件" : "请求执行命令";
  const node = el("div", "approval-card");
  node.appendChild(el("div", "label", label));
  const params = head.params || {};
  const summary = preview(params.reason || params.command || params.cwd || "", 200);
  if (summary) node.appendChild(el("div", "body", summary));
  if (params.command && summary !== params.command) node.appendChild(el("pre", null, params.command));
  const actions = el("div", "actions");
  const allow = el("button", "allow", "允许");
  allow.type = "button";
  const decline = el("button", null, "拒绝");
  decline.type = "button";
  allow.addEventListener("click", () => answer(head.key, { decision: "accept" }));
  decline.addEventListener("click", () => answer(head.key, { decision: "decline" }));
  actions.appendChild(allow);
  actions.appendChild(decline);
  node.appendChild(actions);
  host.appendChild(node);
}

async function answer(key, result) {
  state.approvals = state.approvals.filter((item) => item.key !== key);
  renderApprovals();
  try {
    await api("/api/approvals/" + encodeURIComponent(key), {
      method: "POST",
      body: JSON.stringify({ result }),
    });
  } catch (error) {
    reportError(error);
  }
}

/* ================= 事件流 ================= */

function handleEvent(event) {
  if (!event) return;
  if (event.kind === "status") {
    setStatus(event.connected ? "已连接" : "上游离线", event.connected ? "on" : "off");
    if (!event.connected && event.detail) toast(event.detail, "bad");
    return;
  }
  if (event.kind === "lagged") {
    scheduleReload(200);
    return;
  }
  if (event.kind === "request") {
    if (APPROVAL_METHODS.has(event.method)) {
      const key = event.idKey || String(event.id);
      if (!state.approvals.some((item) => item.key === key)) {
        state.approvals.push({ key, method: event.method, params: event.params || {} });
        renderApprovals();
      }
    }
    return;
  }
  if (event.kind !== "notification") return;
  const params = event.params || {};
  if (state.threadId && params.threadId && params.threadId !== state.threadId) return;
  if (event.method === "item/agentMessage/delta") {
    const live = state.live.get(params.itemId);
    if (live) {
      live.text += params.delta || "";
      live.node.classList.add("caret");
      renderLive(live);
      // 只在自己停在底部时跟随流式输出，翻历史时不打断。
      if (state.autoScroll) scrollToBottom();
      else $("toBottom").querySelector(".new").hidden = false;
    } else {
      scheduleReload(300);
    }
    return;
  }
  if (event.method === "turn/started") {
    startRun(params.turn);
    if (state.threadId) loadQueue(state.threadId).catch(() => {});
    scheduleReload(200);
    return;
  }
  // 上游在队列增删或推进时只发一条通知，列表内容要重新取。
  if (event.method === "thread/queue/changed") {
    if (state.threadId) loadQueue(state.threadId).catch(() => {});
    return;
  }
  if (event.method === "item/started") {
    const item = params.item || {};
    if (item.type === "agentMessage" && item.id) {
      const node = agentMessage("");
      node.classList.add("caret");
      state.live.set(item.id, { node, text: typeof item.text === "string" ? item.text : "", frame: 0 });
      $("transcript").appendChild(node);
      if (state.autoScroll) scrollToBottom();
      else $("toBottom").querySelector(".new").hidden = false;
      return;
    }
    // 思考条目只累计次数，状态条上即时可见，不必为它们重载整段正文。
    if (item.type === "reasoning") {
      if (state.activeTurn) {
        state.activeTurn.reasonings += 1;
        renderRunbar();
      }
      return;
    }
    scheduleReload(400);
    return;
  }
  if (event.method === "turn/completed") {
    endRun();
    clearCommand();
    renderChatHead();
    scheduleReload(250);
    // 回合结束的用量要等 rollout 落盘，稍后再补一次，回合末尾的 token 才是最终值。
    const id = state.threadId;
    if (id) setTimeout(() => { if (state.threadId === id) loadUsage(id).catch(() => {}); }, 1500);
    return;
  }
  if (event.method === "item/completed") {
    const item = params.item || {};
    const live = item.id ? state.live.get(item.id) : null;
    if (live && item.type === "agentMessage") {
      // 用完成事件里的最终文本重渲染，避免整段重载时服务器尚未返回这条消息。
      if (typeof item.text === "string" && item.text) live.text = item.text;
      live.node.textContent = "";
      renderMarkdown(live.node, live.text);
      live.node.classList.remove("caret");
      state.live.delete(item.id);
      return;
    }
    scheduleReload(350);
  }
}

function connectEvents() {
  const source = new EventSource("/api/events?token=" + encodeURIComponent(state.token));
  // 断线期间可能错过回合结束事件，重连后补一次对齐，避免状态条一直停在运行中。
  let dropped = false;
  source.onopen = () => {
    setStatus("已连接", "on");
    if (dropped) {
      dropped = false;
      scheduleReload(200);
    }
  };
  source.onmessage = (message) => {
    try { handleEvent(JSON.parse(message.data)); } catch { /* 忽略单条坏事件 */ }
  };
  source.onerror = () => {
    dropped = true;
    setStatus("重连中…", "warn");
  };
}

/* ================= 令牌门 ================= */

function showGate(hint) {
  $("gate").hidden = false;
  $("app").hidden = true;
  if (hint) $("gate").querySelector("p").textContent = hint;
  $("gateToken").focus();
}

function readToken() {
  const url = new URL(location.href);
  const fromUrl = url.searchParams.get("token");
  if (fromUrl) {
    sessionStorage.setItem(TOKEN_KEY, fromUrl);
    url.searchParams.delete("token");
    history.replaceState({ view: "list" }, "", url.toString());
  }
  return sessionStorage.getItem(TOKEN_KEY) || "";
}

/* ================= 启动 ================= */

/**
 * 把 app 对齐到当前可见视口。地址栏收放与软键盘弹出会改变可见高度，
 * 部分浏览器还会滚动可视视口（offsetTop 不为 0）来露出输入框；只改高度会
 * 让输入栏被顶到屏幕上方并盖住正文，所以这里同时同步 top 与 height。
 */
function syncViewport() {
  const viewport = window.visualViewport;
  const height = Math.round((viewport && viewport.height) || window.innerHeight || 0);
  if (height > 0) $("app").style.height = height + "px";
  const top = Math.max(0, Math.round((viewport && viewport.offsetTop) || 0));
  $("app").style.top = top + "px";
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
}

function bind() {
  syncViewport();
  window.addEventListener("resize", syncViewport);
  window.addEventListener("orientationchange", syncViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncViewport);
    window.visualViewport.addEventListener("scroll", syncViewport);
  }
  // 键盘弹出/收起有动画，聚焦前后各同步几次，避免输入栏停在中间位置。
  const syncSoon = () => {
    syncViewport();
    for (const delay of [80, 200, 400]) setTimeout(syncViewport, delay);
  };
  $("input").addEventListener("focus", syncSoon);
  $("input").addEventListener("blur", syncSoon);
  $("backBtn").addEventListener("click", () => {
    if (history.state && history.state.view === "chat") history.back();
    else showListView();
  });
  $("refreshBtn").addEventListener("click", () => {
    Promise.all([loadThreads(), loadModels()]).catch(reportError);
  });
  $("modelChip").addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("overlay").addEventListener("click", closeSheet);
  $("navBtn").addEventListener("click", openNav);
  $("navClose").addEventListener("click", closeNav);
  $("navOverlay").addEventListener("click", closeNav);
  $("model").addEventListener("change", () => { renderEfforts(); });
  $("search").addEventListener("input", () => {
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(() => loadThreads().catch(reportError), 300);
  });
  $("composer").addEventListener("submit", (event) => { event.preventDefault(); submitInput(); });
  $("stopBtn").addEventListener("click", stop);
  // 「/」与命令项都走统一点按分发，手机上输入栏被键盘挪走也不会丢掉这一次点按。
  bindTap();
  onTap("#cmdBtn", toggleSlash);
  onTap("#imgBtn", () => $("fileInput").click());
  onTap(".slash-item", (node) => {
    const cmd = state.slashMatches[Number(node.dataset.index)];
    if (cmd) runCommand(cmd, "");
  });
  onTap(".attach-remove", (node) => removeAttachment(node.dataset.id));
  $("fileInput").addEventListener("change", () => {
    addImages($("fileInput").files).catch(reportError);
  });
  // 命令面板：点空白处或输入框失焦都收起；面板内的按下会先让输入框失焦，那一次不算。
  let slashHold = false;
  document.addEventListener("pointerdown", (event) => {
    if (!slashVisible()) return;
    slashHold = $("slashPanel").contains(event.target);
    if (slashHold || $("cmdBtn").contains(event.target) || event.target === $("input")) return;
    closeSlash();
  });
  window.addEventListener("pointerup", () => { slashHold = false; });
  window.addEventListener("pointercancel", () => { slashHold = false; });
  $("statusClose").addEventListener("click", closeStatus);
  $("statusOverlay").addEventListener("click", closeStatus);
  $("sendModeClose").addEventListener("click", cancelSendMode);
  $("sendModeOverlay").addEventListener("click", cancelSendMode);
  $("steerChoice").addEventListener("click", () => chooseSendMode("steer"));
  $("queueChoice").addEventListener("click", () => chooseSendMode("queue"));
  $("input").addEventListener("blur", (event) => {
    if (slashHold) return;
    const next = event.relatedTarget;
    if (next && $("slashPanel").contains(next)) return;
    closeSlash();
  });
  $("input").addEventListener("input", () => { autoGrow(); updateSlash(); });
  $("input").addEventListener("keydown", (event) => {
    if (event.isComposing) return;
    if (slashVisible()) {
      const matches = slashMatches($("input").value.trim());
      if ((event.key === "ArrowDown" || event.key === "ArrowUp") && matches.length) {
        event.preventDefault();
        const step = event.key === "ArrowDown" ? 1 : -1;
        state.slashIndex = (state.slashIndex + step + matches.length) % matches.length;
        renderSlash(matches);
        return;
      }
      if (event.key === "Tab" && matches.length) {
        event.preventDefault();
        const cmd = matches[state.slashIndex] || matches[0];
        $("input").value = cmd.usage + (cmd.arg ? " " : "");
        autoGrow();
        updateSlash();
        return;
      }
    }
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      submitInput();
    }
  });
  $("toBottom").addEventListener("click", () => {
    scrollToBottom();
    updateToBottom();
  });
  $("transcript").addEventListener("scroll", updateAtBottom, { passive: true });
  window.addEventListener("popstate", () => showListView());
  window.addEventListener("beforeunload", () => { if (state.threadId) closeThread(state.threadId); });
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeSlash();
      closeSheet();
      closeNav();
      closeStatus();
      cancelSendMode();
    }
  });
}

async function boot() {
  state.token = readToken();
  if (!state.token) {
    showGate();
    $("gateSave").addEventListener("click", () => {
      const value = $("gateToken").value.trim();
      if (!value) return;
      sessionStorage.setItem(TOKEN_KEY, value);
      location.reload();
    });
    return;
  }
  bind();
  setStatus("连接中…", "warn");
  renderThreads();
  renderTranscript(true);
  connectEvents();
  // 网关与桌面共用同一条上游连接，没有独立连接状态时用轮询兜底补齐桌面端发起的回合。
  setInterval(() => {
    if (!state.threadId || state.activeTurnId) return;
    // 用户翻历史时不再打断，等回到最新再续上。
    if (!state.autoScroll) return;
    loadTurns(null).catch(() => {});
  }, 5000);
  try {
    await Promise.all([loadModels(), loadThreads()]);
  } catch (error) {
    reportError(error);
  }
  let last = "";
  try { last = localStorage.getItem(LAST_THREAD_KEY) || ""; } catch { /* 忽略 */ }
  if (last && state.threads.some((thread) => thread.id === last)) {
    openThread(last).catch(() => {});
  } else if (!isMobile() && state.threads.length) {
    openThread(state.threads[0].id).catch(() => {});
  }
}

boot();
</script>

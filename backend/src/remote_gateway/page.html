<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codey 远程控制</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #22262e;
    --line: #2e333d;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --accent: #5b9dff;
    --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; margin-right: 4px; }
  .pill { padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: 12px; }
  .pill.on { color: #7ee2a8; }
  .pill.off { color: #ff8b8b; }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 320px; flex: none; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--panel);
  }
  .thread {
    padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .thread:hover { background: var(--panel-2); }
  .thread.active { background: #26303f; }
  .thread .name { font-weight: 500; }
  .thread .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  section#chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  #head .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #head .meta { color: var(--muted); font-size: 12px; }
  #approval { display: none; padding: 8px 14px; background: #3a2f14; border-bottom: 1px solid var(--warn); font-size: 13px; }
  #approval.show { display: block; }
  #approval button { margin-left: 8px; }
  #transcript { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .turn { border-bottom: 1px dashed var(--line); padding-bottom: 10px; margin-bottom: 10px; }
  .turn:last-child { border-bottom: none; }
  .msg { white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
  .msg.user { background: #1f2937; border-radius: 8px; padding: 8px 10px; }
  .msg.agent { padding: 2px 0; }
  details { margin: 4px 0; color: var(--muted); }
  details > summary { cursor: pointer; font-size: 12px; }
  details pre {
    margin: 6px 0 0; padding: 8px; background: #101216; border-radius: 6px;
    overflow-x: auto; color: #cfd6e4; font-size: 12px; white-space: pre-wrap; word-break: break-all;
  }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  form#composer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea {
    flex: 1; resize: none; height: 64px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit;
  }
  button {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); cursor: pointer; font: inherit;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08101c; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  select, input[type=search] {
    padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; max-width: 240px;
  }
  #gate { padding: 40px; max-width: 460px; margin: 60px auto; }
  #gate input { width: 100%; margin: 10px 0; }
  .err { color: #ff8b8b; font-size: 12px; padding: 0 14px; }
</style>
</head>
<body>
<header>
  <span class="brand">Codey 远程控制</span>
  <span id="status" class="pill">连接中…</span>
  <select id="model" title="模型"></select>
  <select id="effort" title="推理强度"></select>
  <input id="search" type="search" placeholder="搜索对话标题">
  <button id="refresh">刷新</button>
</header>
<div id="err" class="err"></div>
<main>
  <aside id="threads"><div class="empty">正在加载对话…</div></aside>
  <section id="chat">
    <div id="head"><span class="title">选择一个对话</span><span class="meta"></span></div>
    <div id="approval"></div>
    <div id="transcript"><div class="empty">左侧列出本机全部对话，包含桌面端没有打开的会话。</div></div>
    <form id="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="stop" type="button">停止</button>
      <button id="send" class="primary" type="submit">发送</button>
    </form>
  </section>
</main>
<div id="gate" style="display:none">
  <h2>需要访问令牌</h2>
  <p>请打开 Codey 生成的 <code>.codey-remote-gateway.url</code> 链接，或在此粘贴令牌。</p>
  <input id="gate-token" type="password" placeholder="访问令牌">
  <button id="gate-save" class="primary">进入</button>
</div>
<script>
"use strict";

const APPROVAL_METHODS = new Set([
  "item/commandExecution/requestApproval",
  "item/fileChange/requestApproval",
]);

const state = {
  token: "",
  threads: [],
  models: [],
  threadId: null,
  detail: null,
  turns: [],
  nextCursor: null,
  activeTurnId: null,
  live: new Map(),
  reloadTimer: null,
  searchTimer: null,
};

const $ = (id) => document.getElementById(id);

function token() {
  const url = new URL(location.href);
  const fromUrl = url.searchParams.get("token");
  if (fromUrl) {
    sessionStorage.setItem("codey_gateway_token", fromUrl);
    url.searchParams.delete("token");
    history.replaceState(null, "", url.toString());
  }
  return sessionStorage.getItem("codey_gateway_token") || "";
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: {
      Authorization: "Bearer " + state.token,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { error: { message: text } }; }
  if (!response.ok) {
    const error = body && body.error;
    throw new Error((error && (error.message || JSON.stringify(error))) || ("HTTP " + response.status));
  }
  return body;
}

function showError(error) {
  $("err").textContent = error ? String(error.message || error) : "";
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function stamp(seconds) {
  if (!seconds) return "";
  const date = new Date(seconds * 1000);
  return date.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function preview(text, limit = 80) {
  const flat = String(text || "").replace(/\s+/g, " ").trim();
  return flat.length > limit ? flat.slice(0, limit) + "…" : flat;
}

function details(label, text) {
  const node = document.createElement("details");
  node.appendChild(el("summary", null, label));
  node.appendChild(el("pre", null, text));
  return node;
}

function json(value) {
  try { return JSON.stringify(value, null, 2); } catch { return String(value); }
}

function userText(item) {
  const parts = [];
  for (const part of item.content || []) {
    if (part && part.type === "text" && part.text) parts.push(part.text);
    else if (part && part.type) parts.push("[" + part.type + "]");
  }
  return parts.join("\n");
}

function reasoningText(item) {
  const lines = [];
  for (const entry of item.summary || []) lines.push(typeof entry === "string" ? entry : json(entry));
  for (const entry of item.content || []) lines.push(typeof entry === "string" ? entry : json(entry));
  return lines.join("\n");
}

function changeText(changes) {
  return (changes || []).map((change) => {
    if (typeof change === "string") return change;
    const path = change.path || change.file || change.filename;
    const kind = change.kind || change.type || change.action;
    return [kind, path].filter(Boolean).join(" ") || json(change);
  }).join("\n");
}

function renderItem(item) {
  const type = item.type;
  if (type === "userMessage") return el("div", "msg user", userText(item));
  if (type === "agentMessage") {
    const node = el("div", "msg agent", item.text || "");
    if (item.id) node.dataset.itemId = item.id;
    return node;
  }
  if (type === "reasoning") {
    const text = reasoningText(item);
    return text ? details("思考过程", text) : document.createDocumentFragment();
  }
  if (type === "commandExecution") {
    const head = "$ " + (item.command || "");
    const body = [item.cwd ? "cwd: " + item.cwd : "", "status: " + (item.status || "-"), item.exitCode === null || item.exitCode === undefined ? "" : "exit: " + item.exitCode, "", item.aggregatedOutput || ""].join("\n");
    return details(preview(head, 100), body);
  }
  if (type === "fileChange") return details("文件改动 · " + (item.status || ""), changeText(item.changes));
  if (type === "mcpToolCall") {
    const label = "MCP " + (item.server || "") + "." + (item.tool || "");
    const body = [item.status ? "status: " + item.status : "", "arguments:", json(item.arguments), item.error ? "error:\n" + json(item.error) : "", item.result ? "result:\n" + json(item.result) : ""].filter(Boolean).join("\n");
    return details(preview(label, 100), body);
  }
  if (type === "functionCallOutput") return details("工具输出 · " + (item.name || ""), typeof item.output === "string" ? item.output : json(item.output));
  if (type === "plan") return details("计划", item.text || "");
  if (type === "webSearch") return details("联网搜索 · " + (item.query || ""), json(item.results));
  if (type === "imageView") return details("查看图片", item.path || "");
  if (type === "collabAgentToolCall") return details("子代理调用 · " + (item.tool || ""), json({ prompt: item.prompt, agents: item.agentsStates }));
  if (type === "subAgentActivity") return details("子代理活动 · " + (item.kind || ""), item.agentPath || item.agentThreadId || "");
  if (type === "contextCompaction") return details("上下文压缩", "");
  if (type === "enteredReviewMode" || type === "exitedReviewMode") return details(type === "enteredReviewMode" ? "进入评审模式" : "退出评审模式", item.review || "");
  if (type === "hookPrompt") return details("Hook 提示", json(item));
  if (type === "dynamicToolCall" || type === "imageGeneration" || type === "sleep") return details(type, json(item));
  return details(type || "未知项", json(item));
}

function renderTranscript() {
  const root = $("transcript");
  root.textContent = "";
  state.live.clear();
  if (!state.threadId) {
    root.appendChild(el("div", "empty", "左侧列出本机全部对话，包含桌面端没有打开的会话。"));
    return;
  }
  const ordered = state.turns.slice().reverse();
  if (state.nextCursor) {
    const more = el("button", null, "加载更早的消息");
    more.addEventListener("click", () => loadTurns(state.nextCursor).catch(showError));
    root.appendChild(more);
  }
  for (const turn of ordered) {
    const node = el("div", "turn");
    for (const item of turn.items || []) node.appendChild(renderItem(item));
    if (turn.status && turn.status !== "completed") node.appendChild(el("div", "meta", "状态：" + turn.status));
    root.appendChild(node);
  }
  root.scrollTop = root.scrollHeight;
}

function renderThreads() {
  const root = $("threads");
  root.textContent = "";
  if (!state.threads.length) {
    root.appendChild(el("div", "empty", "没有匹配的对话"));
    return;
  }
  for (const thread of state.threads) {
    const node = el("div", "thread" + (thread.id === state.threadId ? " active" : ""));
    node.appendChild(el("div", "name", thread.name || preview(thread.preview) || "(未命名)"));
    node.appendChild(el("div", "sub", (thread.status && thread.status.type === "active" ? "● 运行中 · " : "") + (thread.cwd || "")));
    node.appendChild(el("div", "sub", stamp(thread.updatedAt) + " · " + (thread.model || "")));
    node.addEventListener("click", () => openThread(thread.id).catch(showError));
    root.appendChild(node);
  }
}

function renderModels() {
  const select = $("model");
  select.textContent = "";
  const blank = el("option", null, "（跟随会话）");
  blank.value = "";
  select.appendChild(blank);
  for (const model of state.models) {
    const option = el("option", null, (model.displayName || model.id || model.model) + "");
    option.value = model.id || model.model || "";
    select.appendChild(option);
  }
  select.value = (state.detail && state.detail.model) || "";
  renderEfforts();
}

function currentModel() {
  const id = $("model").value;
  return state.models.find((model) => (model.id || model.model) === id) || null;
}

function renderEfforts() {
  const select = $("effort");
  select.textContent = "";
  const blank = el("option", null, "（默认强度）");
  blank.value = "";
  select.appendChild(blank);
  const model = currentModel();
  for (const option of (model && model.supportedReasoningEfforts) || []) {
    const value = option.reasoningEffort || option;
    const node = el("option", null, value);
    node.value = value;
    node.title = option.description || "";
    select.appendChild(node);
  }
  select.value = (state.detail && state.detail.reasoningEffort) || "";
}

async function loadThreads() {
  const search = $("search").value.trim();
  const query = search ? "?search=" + encodeURIComponent(search) : "";
  const body = await api("/api/threads" + query);
  state.threads = body.threads || [];
  renderThreads();
}

async function loadModels() {
  const body = await api("/api/models");
  state.models = body.models || [];
  renderModels();
}

async function loadTurns(cursor) {
  const query = "?limit=8" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
  const body = await api("/api/threads/" + encodeURIComponent(state.threadId) + "/turns" + query);
  const turns = body.turns || [];
  state.turns = cursor ? state.turns.concat(turns) : turns;
  state.nextCursor = body.nextCursor || null;
  renderTranscript();
}

async function openThread(id) {
  if (state.threadId && state.threadId !== id) closeThread(state.threadId);
  state.threadId = id;
  state.turns = [];
  state.nextCursor = null;
  state.activeTurnId = null;
  renderThreads();
  const detail = await api("/api/threads/" + encodeURIComponent(id));
  state.detail = detail;
  const thread = detail.thread || {};
  document.querySelector("#head .title").textContent = thread.name || preview(thread.preview) || id;
  const statusType = thread.status && thread.status.type !== "notLoaded" ? thread.status.type : "";
  document.querySelector("#head .meta").textContent = [thread.cwd, detail.model, statusType].filter(Boolean).join(" · ");
  $("model").value = detail.model || "";
  renderEfforts();
  await loadTurns(null);
}

function closeThread(id) {
  try {
    navigator.sendBeacon("/api/threads/" + encodeURIComponent(id) + "/close?token=" + encodeURIComponent(state.token));
  } catch { /* 关闭失败不影响切换 */ }
}

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || !state.threadId) return;
  input.value = "";
  try {
    const body = await api("/api/threads/" + encodeURIComponent(state.threadId) + "/messages", {
      method: "POST",
      body: JSON.stringify({ text, model: $("model").value || null, effort: $("effort").value || null }),
    });
    state.activeTurnId = (body.turn && body.turn.id) || null;
    scheduleReload(600);
  } catch (error) {
    showError(error);
  }
}

async function stop() {
  if (!state.threadId || !state.activeTurnId) return;
  try {
    await api("/api/threads/" + encodeURIComponent(state.threadId) + "/interrupt", {
      method: "POST",
      body: JSON.stringify({ turnId: state.activeTurnId }),
    });
  } catch (error) {
    showError(error);
  }
}

function scheduleReload(delay) {
  clearTimeout(state.reloadTimer);
  state.reloadTimer = setTimeout(() => {
    if (state.threadId) loadTurns(null).catch(showError);
  }, delay);
}

function showApproval(key, method, params) {
  const node = $("approval");
  node.textContent = "";
  const label = method === "item/permissions/requestApproval"
    ? "会话请求额外权限"
    : method === "item/fileChange/requestApproval"
      ? "请求修改文件"
      : "请求执行命令";
  node.appendChild(el("span", null, label + "：" + preview(params.command || params.reason || params.cwd || "", 160)));
  const accept = el("button", null, "允许");
  const decline = el("button", null, "拒绝");
  const answer = async (result) => {
    node.classList.remove("show");
    try {
      await api("/api/approvals/" + encodeURIComponent(key), {
        method: "POST",
        body: JSON.stringify({ result }),
      });
    } catch (error) {
      showError(error);
    }
  };
  accept.addEventListener("click", () => answer({ decision: "accept" }));
  decline.addEventListener("click", () => answer({ decision: "decline" }));
  node.appendChild(accept);
  node.appendChild(decline);
  node.classList.add("show");
}

function handleEvent(event) {
  if (event.kind === "status") {
    const pill = $("status");
    pill.textContent = event.connected ? "已连接" : "上游离线";
    pill.className = "pill " + (event.connected ? "on" : "off");
    if (!event.connected && event.detail) $("err").textContent = event.detail;
    return;
  }
  if (event.kind === "request") {
    if (APPROVAL_METHODS.has(event.method)) {
      showApproval(event.idKey || String(event.id), event.method, event.params || {});
    }
    return;
  }
  if (event.kind !== "notification") return;
  const params = event.params || {};
  if (state.threadId && params.threadId && params.threadId !== state.threadId) return;
  if (event.method === "item/agentMessage/delta") {
    const node = state.live.get(params.itemId);
    if (node) node.textContent += params.delta || "";
    else scheduleReload(400);
    return;
  }
  if (event.method === "turn/started") {
    state.activeTurnId = (params.turn && params.turn.id) || state.activeTurnId;
    return;
  }
  if (event.method === "item/started") {
    const item = params.item || {};
    if (state.threadId && item.type === "agentMessage" && item.id) {
      const node = el("div", "msg agent", "");
      node.dataset.itemId = item.id;
      $("transcript").appendChild(node);
      state.live.set(item.id, node);
      $("transcript").scrollTop = $("transcript").scrollHeight;
    }
    return;
  }
  if (event.method === "item/completed" || event.method === "turn/completed") {
    if (event.method === "turn/completed") state.activeTurnId = null;
    scheduleReload(300);
  }
}

function connectEvents() {
  const source = new EventSource("/api/events?token=" + encodeURIComponent(state.token));
  source.onmessage = (message) => {
    try { handleEvent(JSON.parse(message.data)); } catch { /* 忽略单条坏事件 */ }
  };
  source.onerror = () => {
    const pill = $("status");
    pill.textContent = "重连中…";
    pill.className = "pill";
  };
}

function gate() {
  const input = document.getElementById("gate-token");
  document.getElementById("gate-save").addEventListener("click", () => {
    sessionStorage.setItem("codey_gateway_token", input.value.trim());
    location.reload();
  });
  document.getElementById("gate").style.display = "block";
  input.focus();
}

async function boot() {
  state.token = token();
  if (!state.token) {
    document.querySelector("main").style.display = "none";
    document.querySelector("header").style.display = "none";
    gate();
    return;
  }
  $("status").textContent = "连接中…";
  $("refresh").addEventListener("click", () => loadThreads().catch(showError));
  $("search").addEventListener("input", () => {
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(() => loadThreads().catch(showError), 300);
  });
  $("composer").addEventListener("submit", (event) => { event.preventDefault(); send(); });
  $("stop").addEventListener("click", stop);
  $("input").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); }
  });
  $("model").addEventListener("change", renderEfforts);
  window.addEventListener("beforeunload", () => { if (state.threadId) closeThread(state.threadId); });
  connectEvents();
  // 网关是独立实例，看不到桌面端发起回合的实时增量；停在底部时轮询补上这些更新。
  setInterval(() => {
    if (!state.threadId || state.activeTurnId) return;
    const root = $("transcript");
    if (root.scrollHeight - root.scrollTop - root.clientHeight < 80) loadTurns(null).catch(() => {});
  }, 5000);
  try {
    await Promise.all([loadModels(), loadThreads()]);
  } catch (error) {
    showError(error);
  }
}

boot();
</script>
</body>
</html>

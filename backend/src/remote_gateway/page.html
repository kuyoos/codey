<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Codey">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex,nofollow">
  <title>Codey 远程控制</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b8cff'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='700' text-anchor='middle' fill='%230b1020' font-family='system-ui'%3EC%3C/text%3E%3C/svg%3E">
  <style>
    /* ---------- 设计变量：移动端优先的暗色主题 ---------- */
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --surface: #151920;
      --surface-2: #1c212a;
      --surface-3: #232a35;
      --line: #252c37;
      --line-2: #323b49;
      --text: #e9ecf2;
      --muted: #98a3b4;
      --faint: #6b7686;
      --accent: #5b8cff;
      --accent-2: #8b7bff;
      --accent-dim: rgba(91, 140, 255, .15);
      --ok: #48d597;
      --warn: #f5c451;
      --danger: #f87171;
      --radius: 14px;
      --radius-sm: 10px;
      --tap: 42px;
      --shadow: 0 14px 40px rgba(0, 0, 0, .5);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    a { color: var(--accent); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #2b333f; border-radius: 99px; border: 3px solid transparent; background-clip: content-box;
    }

    /* ---------- 骨架 ---------- */
    /* 固定在可见视口上：键盘弹出时脚本同步 top/height，输入栏不会被顶出屏幕或盖住正文。 */
    .app {
      position: fixed; left: 0; right: 0; top: 0; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .topbar {
      flex: none; display: flex; align-items: center; gap: 6px;
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
      background: rgba(15, 17, 21, .88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      position: relative; z-index: 30;
    }
    .logo {
      width: 26px; height: 26px; border-radius: 8px; flex: none;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; color: #0b1020; font-size: 14px; font-weight: 700;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .grow { flex: 1; min-width: 0; }
    .status {
      display: inline-flex; align-items: center; gap: 6px; flex: none;
      padding: 3px 9px; border-radius: 999px; background: var(--surface-2);
      color: var(--muted); font-size: 12px; white-space: nowrap;
    }
    .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
    .status.on .dot { background: var(--ok); animation: pulse 2.4s ease-in-out infinite; }
    .status.off .dot { background: var(--danger); }
    .status.warn .dot { background: var(--warn); }
    @keyframes pulse { 50% { opacity: .35; } }
    .icon-btn {
      width: var(--tap); height: var(--tap); border-radius: 12px; flex: none;
      display: grid; place-items: center; color: var(--muted);
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .chip-btn {
      display: inline-flex; align-items: center; gap: 6px; flex: none; max-width: 40vw;
      padding: 6px 11px; border-radius: 999px; font-size: 12.5px;
      background: var(--surface-2); border: 1px solid var(--line);
      white-space: nowrap;
    }
    .chip-btn:hover { border-color: var(--line-2); }
    .chip-btn .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-btn .k { color: var(--faint); font-size: 11px; }

    .body { flex: 1; display: flex; min-height: 0; position: relative; }

    /* ---------- 会话列表 ---------- */
    .sidebar {
      width: 332px; flex: none; min-height: 0; display: flex; flex-direction: column;
      background: var(--surface); border-right: 1px solid var(--line);
    }
    .sidebar-head { flex: none; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
    .search { position: relative; flex: 1; min-width: 0; }
    .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--faint); fill: none; stroke-width: 2; }
    .search input {
      width: 100%; height: 38px; padding: 0 12px 0 32px; border-radius: 11px;
      background: var(--surface-2); border: 1px solid var(--line); outline: none;
    }
    .search input:focus { border-color: var(--accent); }
    .count { flex: none; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
    .thread-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 8px 12px; -webkit-overflow-scrolling: touch; }
    .group-label {
      padding: 12px 8px 6px; color: var(--faint); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
    }
    .thread {
      padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid transparent; display: flex; flex-direction: column; gap: 2px;
    }
    .thread:hover { background: var(--surface-2); }
    .thread.active { background: var(--accent-dim); border-color: rgba(91, 140, 255, .35); }
    .t-top { display: flex; align-items: center; gap: 6px; }
    .t-name { font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-prev { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-meta { color: var(--faint); font-size: 11.5px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; }
    .t-meta .sep { opacity: .5; }
    .t-meta .mono { overflow: hidden; text-overflow: ellipsis; }
    .run-badge {
      display: inline-flex; align-items: center; gap: 4px; flex: none;
      padding: 1px 7px; border-radius: 999px; font-size: 11px;
      background: rgba(72, 213, 151, .14); color: var(--ok);
    }
    .run-badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
    .sidebar-foot {
      flex: none; padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      border-top: 1px solid var(--line); color: var(--faint); font-size: 11.5px; line-height: 1.5;
    }

    /* ---------- 对话区 ---------- */
    .chat { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
    .chat-head {
      flex: none; padding: 9px 14px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .chat-titles { min-width: 0; flex: 1; }
    .chat-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-meta { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .transcript {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
      padding: 14px 14px 8px;
    }
    .turn { display: flex; flex-direction: column; gap: 7px; }
    .turn + .turn { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .turn-head { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11.5px; }
    .turn-head .line { flex: 1; height: 1px; background: var(--line); }
    .turn-head .meta { color: var(--faint); white-space: nowrap; }
    .turn.flash { animation: flash 1.2s ease; }
    @keyframes flash { 0%, 100% { background: transparent; } 20% { background: var(--accent-dim); } }
    .chip {
      display: inline-flex; align-items: center; gap: 5px; padding: 1.5px 8px; border-radius: 999px;
      font-size: 11.5px; background: var(--surface-2); color: var(--muted); white-space: nowrap;
    }
    .chip.ok { color: var(--ok); background: rgba(72, 213, 151, .12); }
    .chip.run { color: var(--accent); background: var(--accent-dim); }
    .chip.warn { color: var(--warn); background: rgba(245, 196, 81, .12); }
    .chip.bad { color: var(--danger); background: rgba(248, 113, 113, .12); }
    .chip.run i, .chip.run b { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
    .msg.user {
      align-self: flex-end; max-width: 88%; white-space: pre-wrap; word-break: break-word;
      background: linear-gradient(180deg, #26324a, #202a3d);
      border: 1px solid rgba(91, 140, 255, .28);
      border-radius: 16px 16px 4px 16px; padding: 9px 12px;
    }
    .msg.agent { max-width: 100%; }
    /* 编辑与复制默认隐藏，悬停或聚焦时出现，触屏设备上常驻，避免正文被按钮挤占。 */
    .msg-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; opacity: 0; transition: opacity .15s ease; }
    .msg.user:hover .msg-actions, .msg.user:focus-within .msg-actions { opacity: 1; }
    .msg-actions button {
      padding: 2px 8px; border-radius: 7px; font-size: 11.5px; color: var(--muted);
      background: rgba(255, 255, 255, .06); border: 1px solid var(--line-2);
    }
    .msg-actions button:hover { color: var(--text); }
    @media (hover: none) { .msg-actions { opacity: .75; } }
    .caret::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: pulse 1s steps(2, start) infinite; }
    .more-btn {
      align-self: center; margin: 4px 0 10px; padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); font-size: 12.5px;
    }
    .more-hint { align-self: center; margin: 4px 0 10px; color: var(--faint); font-size: 12px; }

    /* ---------- Markdown ---------- */
    .md-p { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .md-h { margin: 12px 0 4px; font-weight: 650; }
    .md-h1 { font-size: 18px; } .md-h2 { font-size: 16.5px; } .md-h3 { font-size: 15.5px; } .md-h4 { font-size: 15px; }
    .md-list { margin: 6px 0; padding-left: 20px; }
    .md-list li { margin: 2px 0; }
    .md-quote { margin: 8px 0; padding: 2px 0 2px 12px; border-left: 3px solid var(--line-2); color: var(--muted); }
    .md-code {
      padding: 1.5px 5px; border-radius: 6px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 13px; background: var(--surface-3); overflow-wrap: anywhere;
    }
    .md-link { text-decoration: none; border-bottom: 1px solid rgba(91, 140, 255, .4); }
    .md-del { color: var(--muted); text-decoration: line-through; }
    .md-img { display: block; max-width: 100%; border-radius: 10px; margin: 8px 0; }
    .md-hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
    .md-task { display: flex; align-items: flex-start; gap: 7px; }
    .md-task input { flex: none; margin: 4px 0 0; accent-color: var(--accent); }
    .md-table { display: block; width: 100%; margin: 9px 0; border-collapse: collapse; overflow-x: auto; font-size: 13px; }
    .md-table th, .md-table td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
    .md-table th { background: var(--surface-2); font-weight: 600; }
    .md-list .md-list { margin: 2px 0 2px 2px; }
    .md-h5 { font-size: 14.5px; } .md-h6 { font-size: 14px; color: var(--muted); }
    .code-block { margin: 9px 0; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: #0c0e12; }
    .code-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 5px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line);
      color: var(--faint); font-size: 11.5px;
    }
    .code-head .copy { color: var(--muted); font-size: 11.5px; padding: 2px 6px; border-radius: 6px; }
    .code-head .copy:hover { background: var(--surface-3); color: var(--text); }
    .code-block pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; }
    .code-block code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; white-space: pre; }

    /* ---------- 工具卡片 ---------- */
    .card { margin: 8px 0; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
    .card-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
    .card-head .icon { color: var(--faint); font-family: ui-monospace, Menlo, Consolas, monospace; flex: none; }
    .card-head .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
    .card-sub { padding: 0 10px 8px; color: var(--faint); font-size: 11.5px; word-break: break-all; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .card-pre {
      margin: 0; padding: 9px 10px; background: #0c0e12; border-top: 1px solid var(--line);
      font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow: auto;
    }
    .diff-row { display: flex; gap: 8px; padding: 4px 10px; font-size: 12.5px; border-top: 1px solid var(--line); }
    .diff-row .kind { color: var(--warn); flex: none; }
    .diff-row .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diff-row.more { color: var(--faint); }
    .tool-row { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-top: 1px solid var(--line); font-size: 12.5px; }
    .tool-row .icon { color: var(--faint); flex: none; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .tool-row .mono { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tool-row.more { color: var(--faint); }
    .tool-row.is-failed .mono { color: var(--danger); }
    details.raw { border-top: 1px solid var(--line); }
    details.raw > summary {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; list-style: none;
    }
    details.raw > summary::-webkit-details-marker { display: none; }
    details.raw > summary::before { content: "▸"; color: var(--faint); flex: none; }
    details.raw[open] > summary::before { content: "▾"; }
    .raw-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    summary .copy { flex: none; color: var(--muted); font-size: 11.5px; padding: 2px 7px; border-radius: 6px; }
    summary .copy:hover { background: var(--surface-3); color: var(--text); }
    /* 思考、工具与命令都只留一行计数，和聊天里的元信息一样轻。 */
    .think, .tool-note {
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
      margin: 4px 0; padding: 3px 10px; border-radius: 999px;
      background: var(--surface-2); color: var(--faint); font-size: 12px;
    }
    .tool-note .icon { color: var(--faint); }
    details.card {
      border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface);
      overflow: hidden; margin: 8px 0;
    }
    details.card > summary {
      display: flex; align-items: center; gap: 8px; padding: 9px 10px;
      cursor: pointer; color: var(--muted); font-size: 13px; list-style: none;
    }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::before { content: "▸"; color: var(--faint); flex: none; }
    details.card[open] > summary::before { content: "▾"; }
    details.card[open] > summary { border-bottom: 1px solid var(--line); }
    details.card .icon { color: var(--faint); flex: none; }

    /* ---------- 审批 ---------- */
    .approval-host { flex: none; padding: 0 14px; }
    .approval-card {
      margin: 8px 0; border: 1px solid rgba(245, 196, 81, .45); background: rgba(245, 196, 81, .09);
      border-radius: var(--radius); padding: 10px 12px;
    }
    .approval-card .label { color: var(--warn); font-size: 12.5px; font-weight: 600; }
    .approval-card .body { margin: 4px 0 8px; font-size: 13px; word-break: break-word; }
    .approval-card pre { margin: 4px 0 8px; padding: 8px; background: #0c0e12; border-radius: 8px; font-size: 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
    .approval-card .actions { display: flex; gap: 8px; }
    .approval-card .actions button { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--line-2); }
    .approval-card .actions .allow { background: var(--accent); border-color: var(--accent); color: #08101c; font-weight: 600; }

    /* ---------- 输入区 ---------- */
    .composer {
      flex: none; display: flex; align-items: flex-end; gap: 8px;
      padding: 9px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: rgba(15, 17, 21, .92); backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
    }
    .composer textarea {
      flex: 1; min-width: 0; resize: none; max-height: 40vh; min-height: 42px;
      padding: 10px 12px; border-radius: 13px; outline: none;
      background: var(--surface-2); border: 1px solid var(--line); line-height: 1.5;
    }
    .composer textarea:focus { border-color: var(--accent); }
    .composer .send {
      width: var(--tap); height: var(--tap); flex: none; border-radius: 13px; display: grid; place-items: center;
      background: var(--accent); color: #08101c;
    }
    .composer .send:disabled { opacity: .45; }
    .composer .stop { background: var(--surface-2); border: 1px solid var(--line-2); color: var(--danger); border-radius: 13px; }
    .composer svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .to-bottom {
      position: absolute; right: 16px; bottom: 84px; width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface-3); border: 1px solid var(--line-2); box-shadow: var(--shadow);
      display: grid; place-items: center; color: var(--muted); z-index: 12;
    }
    .to-bottom .new { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }

    /* ---------- 弹层、提示 ---------- */
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 40; animation: fade .16s ease; }
    @keyframes fade { from { opacity: 0; } }
    .sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
    .sheet-panel {
      width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 18px 18px 0 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
      box-shadow: var(--shadow); animation: rise .2s ease;
    }
    @keyframes rise { from { transform: translateY(16px); opacity: .4; } }
    .grabber { width: 38px; height: 4px; border-radius: 99px; background: var(--line-2); margin: 2px auto 12px; }
    .sheet-title { font-weight: 600; margin-bottom: 10px; }
    .field { display: block; margin-bottom: 12px; }
    .field > span { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; }
    .field select, .field input {
      width: 100%; height: 42px; padding: 0 10px; border-radius: 11px;
      background: var(--surface-2); border: 1px solid var(--line); outline: none;
    }
    .sheet-info { color: var(--faint); font-size: 12px; line-height: 1.7; margin-bottom: 8px; word-break: break-all; }
    .sheet-note { color: var(--faint); font-size: 11.5px; margin-bottom: 12px; }
    .sheet-close {
      width: 100%; height: 44px; border-radius: 12px; background: var(--accent); color: #08101c; font-weight: 600;
    }
    /* 会话导航：列出每个回合的用户输入，点击跳到对应位置。 */
    .nav-list { max-height: min(56vh, 440px); overflow-y: auto; margin: 2px 0 10px; }
    .nav-item {
      display: flex; gap: 10px; width: 100%; text-align: left; padding: 9px 6px;
      border-bottom: 1px solid var(--line); background: transparent; color: var(--text);
    }
    .nav-item:hover { background: var(--surface-2); }
    .nav-item .n {
      flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3);
      color: var(--faint); font-size: 11.5px; display: grid; place-items: center;
    }
    .nav-body { min-width: 0; flex: 1; }
    .nav-text {
      font-size: 13.5px; line-height: 1.5; overflow: hidden; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    .toast {
      pointer-events: auto; max-width: 88vw; padding: 9px 14px; border-radius: 12px; font-size: 13px;
      background: #2a3240; border: 1px solid var(--line-2); box-shadow: var(--shadow); animation: rise .18s ease;
    }
    .toast.bad { background: #3a2226; border-color: rgba(248, 113, 113, .5); }

    /* ---------- 空状态与骨架 ---------- */
    .empty { color: var(--muted); text-align: center; padding: 34px 18px; font-size: 13.5px; }
    .empty .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
    .skeleton { border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: slide 1.3s linear infinite; height: 62px; margin: 6px 4px; }
    @keyframes slide { to { background-position: -200% 0; } }

    /* ---------- 令牌门 ---------- */
    .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: var(--bg); z-index: 70; }
    .gate-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
    .gate-card h2 { margin: 0 0 6px; font-size: 17px; }

    .gate-card input { width: 100%; height: 44px; padding: 0 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); outline: none; }
    .gate-card button { width: 100%; height: 44px; margin-top: 12px; border-radius: 11px; background: var(--accent); color: #08101c; font-weight: 600; }
    .gate-card code { background: var(--surface-3); padding: 1px 5px; border-radius: 5px; font-size: 12px; }

    /* ---------- 响应式：手机上是「列表 ⇄ 对话」两屏 ---------- */
    @media (max-width: 860px) {
      body { font-size: 16px; }
      .composer textarea, .search input, .field select, .field input, .gate-card input { font-size: 16px; }
      .sidebar { position: absolute; inset: 0; width: 100%; border-right: 0; z-index: 20; }
      .back-btn { display: none; }
      .app[data-view="chat"] .back-btn { display: grid; }

      .app[data-view="list"] .chat { display: none; }
      .chip-btn { max-width: 44vw; }
      .chip-btn .k { display: none; }

    }
    @media (min-width: 861px) {
      .back-btn { display: none; }
      .sheet { align-items: center; }
      .sheet-panel { border-radius: 18px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
      .grabber { display: none; }
    }
    /* 宽屏时把正文收窄居中，和常见聊天网页一样保持行宽可读。 */
    @media (min-width: 1100px) {
      .transcript, .composer, .chat-head, .approval-host {
        padding-left: max(14px, calc((100% - 860px) / 2));

    @media (prefers-reduced-motion: reduce) {
      *, *::after, *::before { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>

<script>
"use strict";

// 只有网页能给出合法决策的审批才展示；其余反向请求由桌面端应答。
const APPROVAL_METHODS = new Set([
  "item/commandExecution/requestApproval",
  "item/fileChange/requestApproval",
]);
const TOKEN_KEY = "codey_gateway_token";
const LAST_THREAD_KEY = "codey_gateway_last_thread";
// 网页只保留最近几个回合，翻到上限就不再往回取，避免长会话把正文堆满页面。
const TURNS_PAGE = 5;
const MAX_TURNS = 15;
// 单次改动涉及的文件数量没有上限，网页只列一部分，其余折叠成计数。
const FILE_ROW_LIMIT = 40;

const state = {
  token: "",
  threads: [],
  models: [],
  threadId: null,
  detail: null,
  turns: [],
  nextCursor: null,
  activeTurnId: null,
  live: new Map(),
  usage: { total: null, turns: {} },
  approvals: [],
  reloadTimer: null,
  searchTimer: null,
  loaded: false,
};

const $ = (id) => document.getElementById(id);
const isMobile = () => window.matchMedia("(max-width: 860px)").matches;

/* ================= 基础工具 ================= */

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function mono(text) {
  return el("span", "mono", text);
}

function preview(text, limit) {
  const flat = String(text || "").replace(/\s+/g, " ").trim();
  const max = limit || 90;
  return flat.length > max ? flat.slice(0, max) + "…" : flat;
}

function json(value) {
  try { return JSON.stringify(value, null, 2); } catch { return String(value); }
}

function pad(value) {
  return value < 10 ? "0" + value : String(value);
}

function clock(date) {
  return pad(date.getHours()) + ":" + pad(date.getMinutes());
}

function sameDay(left, right) {
  return left.getFullYear() === right.getFullYear() && left.getMonth() === right.getMonth() && left.getDate() === right.getDate();
}

// 会话列表里的相对时间，和手机聊天应用的习惯一致。
function relTime(seconds) {
  if (!seconds) return "";
  const date = new Date(seconds * 1000);
  const now = new Date();
  const diff = (Date.now() - date.getTime()) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (sameDay(date, now)) return "今天 " + clock(date);
  const yesterday = new Date(now.getTime() - 86400000);
  if (sameDay(date, yesterday)) return "昨天 " + clock(date);
  if (diff < 604800) return Math.floor(diff / 86400) + " 天前";
  return (date.getMonth() + 1) + "月" + date.getDate() + "日";
}

function groupOf(seconds) {
  if (!seconds) return "更早";
  const date = new Date(seconds * 1000);
  const now = new Date();
  if (sameDay(date, now)) return "今天";
  if (sameDay(date, new Date(now.getTime() - 86400000))) return "昨天";
  if ((Date.now() - date.getTime()) / 1000 < 604800) return "本周";
  return "更早";
}

/* token 与耗时都来自 app-server 的回合数据与落盘用量，这里只做紧凑展示。 */
function formatTokens(value) {
  const count = Number(value);
  if (!Number.isFinite(count) || count <= 0) return "";
  if (count < 1000) return String(count);
  if (count < 1000000) return (count / 1000).toFixed(count < 10000 ? 1 : 0) + "k";
  return (count / 1000000).toFixed(2) + "M";
}

function formatDuration(ms) {
  const value = Number(ms);
  if (!Number.isFinite(value) || value <= 0) return "";
  const total = Math.round(value / 1000);
  if (total < 60) return total + " 秒";
  const minutes = Math.floor(total / 60);
  if (minutes < 60) return minutes + " 分 " + (total % 60) + " 秒";
  return Math.floor(minutes / 60) + " 小时 " + (minutes % 60) + " 分";
}

function turnMeta(turn) {
  const parts = [];
  const duration = formatDuration(turn && turn.durationMs);
  if (duration) parts.push("耗时 " + duration);
  const usage = state.usage.turns[(turn && turn.id) || ""];
  const tokens = usage && formatTokens(usage.total_tokens);
  if (tokens) parts.push(tokens + " tokens");
  return parts.join(" · ");
}

async function copyText(text, label) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.top = "-1000px";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    toast((label || "已复制") + "到剪贴板");
  } catch {
    toast("复制失败，请长按手动复制", "bad");
  }
}

function toast(message, kind) {
  const node = el("div", "toast" + (kind ? " " + kind : ""), message);
  node.addEventListener("click", () => node.remove());
  $("toastHost").appendChild(node);
  setTimeout(() => node.remove(), 4200);
}

function setStatus(text, kind) {
  $("statusText").textContent = text;
  $("statusPill").className = "status" + (kind ? " " + kind : "");
}

/* ================= 接口 ================= */

async function api(path, options) {
  const response = await fetch(path, {
    ...(options || {}),
    headers: {
      Authorization: "Bearer " + state.token,
      "Content-Type": "application/json",
      ...((options && options.headers) || {}),
    },
  });
  const text = await response.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { error: { message: text } }; }
  if (response.status === 401) {
    sessionStorage.removeItem(TOKEN_KEY);
    showGate("访问令牌无效或不匹配，请粘贴控制台里的完整链接。");
    throw new Error("访问令牌无效");
  }
  if (!response.ok) {
    const error = body && body.error;
    throw new Error((error && (error.message || JSON.stringify(error))) || ("HTTP " + response.status));
  }
  return body;
}

/* ================= Markdown 渲染（只生成 DOM，不注入 HTML） ================= */

// 行内标记：粗斜体 / 粗体 / 斜体 / 删除线 / 行内代码 / 图片 / 链接 / 裸链接。
// 刻意不解析 _强调_，避免把 foo_bar 这类标识符拆成斜体。
const INLINE = /(\*\*\*[^*\n]+\*\*\*|\*\*[^*\n]+\*\*|~~[^~\n]+~~|`[^`\n]+`|!\[[^\]\n]*\]\([^)\s]+\)|\[[^\]\n]*\]\([^)\s]+\)|https?:\/\/[^\s<>()]+|\*[^*\n]+\*)/g;

/** 只放行常规协议，避免 javascript: 之类的链接。 */
function safeHref(url) {
  return /^(https?:|mailto:)/i.test(url) ? url : null;
}

function externalLink(label, url) {
  const href = safeHref(url);
  if (!href) return document.createTextNode(label || url);
  const link = el("a", "md-link", label || href);
  link.href = href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function renderInline(parent, text) {
  const value = String(text === undefined || text === null ? "" : text);
  let last = 0;
  let match;
  INLINE.lastIndex = 0;
  while ((match = INLINE.exec(value)) !== null) {
    if (match.index > last) parent.appendChild(document.createTextNode(value.slice(last, match.index)));
    const token = match[0];
    if (token.startsWith("***")) {
      const strong = el("strong");
      strong.appendChild(el("em", null, token.slice(3, -3)));
      parent.appendChild(strong);
    } else if (token.startsWith("**")) {
      parent.appendChild(el("strong", null, token.slice(2, -2)));
    } else if (token.startsWith("~~")) {
      parent.appendChild(el("span", "md-del", token.slice(2, -2)));
    } else if (token.startsWith("`")) {
      parent.appendChild(el("code", "md-code", token.slice(1, -1)));
    } else if (token.startsWith("![")) {
      const parts = /^!\[([^\]]*)\]\(([^)\s]+)\)$/.exec(token);
      const href = parts && safeHref(parts[2]);
      if (href) {
        const image = el("img", "md-img");
        image.src = href;
        image.alt = parts[1] || "";
        image.loading = "lazy";
        parent.appendChild(image);
      } else {
        parent.appendChild(document.createTextNode(token));
      }
    } else if (token.startsWith("[")) {
      const parts = /^\[([^\]]*)\]\(([^)\s]+)\)$/.exec(token);
      parent.appendChild(parts ? externalLink(parts[1], parts[2]) : document.createTextNode(token));
    } else if (token.startsWith("http")) {
      parent.appendChild(externalLink(token, token));
    } else {
      parent.appendChild(el("em", null, token.slice(1, -1)));
    }
    last = match.index + token.length;
  }
  if (last < value.length) parent.appendChild(document.createTextNode(value.slice(last)));
}

function codeBlock(language, code) {
  const wrap = el("div", "code-block");
  const head = el("div", "code-head");
  head.appendChild(el("span", null, language || "代码"));
  const copy = el("button", "copy", "复制");
  copy.type = "button";
  copy.addEventListener("click", () => copyText(code));
  head.appendChild(copy);
  wrap.appendChild(head);
  const pre = el("pre");
  pre.appendChild(el("code", null, code));
  wrap.appendChild(pre);
  return wrap;
}

const FENCE = /^\s*(```|~~~)\s*([A-Za-z0-9_+#.-]*)\s*$/;
const HEADING = /^(#{1,6})\s+(.*)$/;
const HR = /^\s*([-*_])\s*(?:\1\s*){2,}$/;
const BULLET = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const QUOTE = /^\s*>\s?/;
const TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/;
const TASK = /^\[([ xX])\]\s+(.*)$/;

function splitRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
}

/** 解析一层列表；缩进更深的子项递归挂到当前条目下，返回 [节点, 下一行号]。 */
function parseList(lines, start) {
  const first = BULLET.exec(lines[start]);
  const root = el(/\d/.test(first[2]) ? "ol" : "ul", "md-list");
  const base = first[1].length;
  let index = start;
  let current = null;
  while (index < lines.length) {
    const hit = BULLET.exec(lines[index]);
    if (!hit) break;
    const indent = hit[1].length;
    if (indent < base) break;
    if (indent > base && current) {
      const nested = parseList(lines, index);
      current.appendChild(nested[0]);
      index = nested[1];
      continue;
    }
    current = el("li");
    const task = TASK.exec(hit[3]);
    if (task) {
      const label = el("label", "md-task");
      const box = el("input");
      box.type = "checkbox";
      box.disabled = true;
      box.checked = task[1].toLowerCase() === "x";
      label.appendChild(box);
      const span = el("span");
      renderInline(span, task[2]);
      label.appendChild(span);
      current.appendChild(label);
    } else {
      renderInline(current, hit[3]);
    }
    root.appendChild(current);
    index += 1;
  }
  return [root, index];
}

function renderMarkdown(parent, text) {
  const lines = String(text === undefined || text === null ? "" : text).replace(/\r\n?/g, "\n").split("\n");
  const paragraph = [];
  const flush = () => {
    if (!paragraph.length) return;
    const node = el("p", "md-p");
    renderInline(node, paragraph.join("\n"));
    parent.appendChild(node);
    paragraph.length = 0;
  };
  let index = 0;
  while (index < lines.length) {
    const line = lines[index];
    const fence = FENCE.exec(line);
    if (fence) {
      flush();
      const close = new RegExp("^\\s*" + fence[1] + "\\s*$");
      const body = [];
      index += 1;
      while (index < lines.length && !close.test(lines[index])) {
        body.push(lines[index]);
        index += 1;
      }
      index += 1;
      parent.appendChild(codeBlock(fence[2], body.join("\n")));
      continue;
    }
    if (HR.test(line)) {
      flush();
      parent.appendChild(el("hr", "md-hr"));
      index += 1;
      continue;
    }
    const heading = HEADING.exec(line);
    if (heading) {
      flush();
      const node = el("div", "md-h md-h" + heading[1].length);
      renderInline(node, heading[2]);
      parent.appendChild(node);
      index += 1;
      continue;
    }
    if (line.indexOf("|") >= 0 && index + 1 < lines.length && TABLE_SEP.test(lines[index + 1])) {
      flush();
      const table = el("table", "md-table");
      const thead = el("thead");
      const headRow = el("tr");
      for (const cell of splitRow(line)) {
        const th = el("th");
        renderInline(th, cell);
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = el("tbody");
      index += 2;
      while (index < lines.length && lines[index].trim() && lines[index].indexOf("|") >= 0) {
        const row = el("tr");
        for (const cell of splitRow(lines[index])) {
          const td = el("td");
          renderInline(td, cell);
          row.appendChild(td);
        }
        tbody.appendChild(row);
        index += 1;
      }
      table.appendChild(tbody);
      parent.appendChild(table);
      continue;
    }
    if (BULLET.test(line)) {
      flush();
      const parsed = parseList(lines, index);
      parent.appendChild(parsed[0]);
      index = parsed[1];
      continue;
    }
    if (QUOTE.test(line)) {
      flush();
      const quote = el("blockquote", "md-quote");
      while (index < lines.length && QUOTE.test(lines[index])) {
        const node = el("div");
        renderInline(node, lines[index].replace(QUOTE, ""));
        quote.appendChild(node);
        index += 1;
      }
      parent.appendChild(quote);
      continue;
    }
    if (!line.trim()) {
      flush();
      index += 1;
      continue;
    }
    paragraph.push(line);
    index += 1;
  }
  flush();
}

/** 流式输出：按帧节流重渲染整段 Markdown，避免逐字追加时用户看到未格式化的原文。 */
function renderLive(live) {
  if (live.frame) return;
  live.frame = requestAnimationFrame(() => {
    live.frame = 0;
    live.node.textContent = "";
    renderMarkdown(live.node, live.text);
  });
}

/* ================= 消息与工具卡片 ================= */

function agentMessage(text) {
  const node = el("div", "msg agent");
  renderMarkdown(node, text || "");
  return node;
}

function messageText(item) {
  const parts = [];
  for (const part of (item && item.content) || []) {
    if (part && part.type === "text" && part.text) parts.push(part.text);
    else if (part && part.type) parts.push("[" + part.type + "]");
  }
  return parts.join("\n");
}

function userMessage(item) {
  const text = messageText(item);
  const node = el("div", "msg user", text);
  const actions = el("div", "msg-actions");
  const copy = el("button", null, "复制");
  copy.type = "button";
  copy.addEventListener("click", () => copyText(text, "已复制消息"));
  const edit = el("button", null, "编辑");
  edit.type = "button";
  edit.addEventListener("click", () => editMessage(text));
  actions.appendChild(copy);
  actions.appendChild(edit);
  node.appendChild(actions);
  return node;
}

// 编辑把消息回填到输入框：历史仍保留，改完直接发送即可重新提问。
function editMessage(text) {
  const input = $("input");
  input.value = text;
  autoGrow();
  input.focus();
  try { input.setSelectionRange(text.length, text.length); } catch { /* 忽略 */ }
  toast("已填入输入框，修改后发送");
}

// app-server 的 kind 是 { type, move_path } 对象，先归一化成短标签再展示。
const CHANGE_LABELS = {
  add: "新增", added: "新增", create: "新增", created: "新增",
  update: "修改", modified: "修改", modify: "修改", edit: "修改",
  delete: "删除", deleted: "删除", remove: "删除", removed: "删除",
  move: "移动", moved: "移动", rename: "移动", renamed: "移动", copy: "复制",
};

function changeLabel(kind) {
  if (kind && typeof kind === "object") kind = kind.type || kind.kind || kind.action;
  return CHANGE_LABELS[String(kind || "").toLowerCase()] || "";
}

function changeRows(changes) {
  const rows = [];
  for (const change of changes || []) {
    if (typeof change === "string") { rows.push({ kind: "", path: change }); continue; }
    const path = change.path || change.file || change.filename;
    if (!path) continue;
    rows.push({ kind: changeLabel(change.kind || change.type || change.action), path });
  }
  return rows;
}

// 工具与命令只留一行计数，和思考一样轻；正文在网关侧已裁掉，网页不再逐项渲染。
const TOOL_TYPES = new Set([
  "commandExecution", "mcpToolCall", "dynamicToolCall",
  "functionCallOutput", "webSearch", "collabAgentToolCall",
]);

function toolGroup(items) {
  const node = el("div", "tool-note");
  node.appendChild(el("span", "icon", "⛭"));
  node.appendChild(el("span", null, "工具与命令 " + items.length + " 项"));
  return node;
}

// 连续的文件改动也只算一张卡片：只列改了哪些文件与改动类型。
function fileBlock(items) {
  const rows = [];
  let status = null;
  for (const item of items) {
    for (const row of changeRows(item.changes)) rows.push(row);
    if (!status) status = item.status;
  }
  const node = card("±", "修改了 " + rows.length + " 个文件", statusChip(status));
  for (const row of rows.slice(0, FILE_ROW_LIMIT)) {
    const line = el("div", "diff-row");
    line.appendChild(el("span", "kind", row.kind || "修改"));
    line.appendChild(el("span", "mono", row.path));
    line.title = row.path;
    node.appendChild(line);
  }
  if (rows.length > FILE_ROW_LIMIT) {
    node.appendChild(el("div", "diff-row more", "还有 " + (rows.length - FILE_ROW_LIMIT) + " 个文件"));
  }
  return node;
}

function card(kind, title, chip) {
  const node = el("div", "card");
  const head = el("div", "card-head");
  head.appendChild(el("span", "icon", kind));
  head.appendChild(el("span", "title", title));
  if (chip) head.appendChild(chip);
  node.appendChild(head);
  return node;
}

function copyButton(text) {
  const copy = el("button", "copy", "复制");
  copy.type = "button";
  copy.addEventListener("click", (event) => {
    // 复制按钮在 summary 里，点它不要顺带折叠卡片。
    event.preventDefault();
    event.stopPropagation();
    copyText(text, "已复制");
  });
  return copy;
}

function rawBlock(label, text, open) {
  const details = el("details", "raw");
  if (open) details.open = true;
  const summary = el("summary");
  summary.appendChild(el("span", "raw-label", label));
  summary.appendChild(copyButton(text));
  details.appendChild(summary);
  details.appendChild(el("pre", "card-pre", text));
  return details;
}

function statusChip(status, exitCode) {
  const value = String(status || "").toLowerCase();
  const table = {
    completed: ["已完成", "ok"], success: ["已完成", "ok"],
    inprogress: ["运行中", "run"], running: ["运行中", "run"], active: ["运行中", "run"], pending: ["排队中", "run"],
    failed: ["失败", "bad"], error: ["失败", "bad"],
    interrupted: ["已中断", "warn"], cancelled: ["已中断", "warn"], canceled: ["已中断", "warn"], declined: ["已拒绝", "warn"],
  };
  const hit = table[value];
  if (!hit) {
    if (exitCode === null || exitCode === undefined) return null;
    return el("span", "chip " + (exitCode === 0 ? "ok" : "bad"), "exit " + exitCode);
  }
  const node = el("span", "chip " + hit[1]);
  if (hit[1] === "run") node.appendChild(el("i"));
  node.appendChild(el("span", null, hit[0]));
  return node;
}

function renderItem(item) {
  const type = item && item.type;
  if (type === "userMessage") return userMessage(item);
  if (type === "agentMessage") return agentMessage(item.text || "");
  if (type === "reasoning") return null;
  if (type === "commandExecution") {
    // 标题本来就会被 CSS 截成一行，先截好文案可以省掉超长命令的排版开销。
    const node = card("$", preview(item.command || "", 160), statusChip(item.status, item.exitCode));
    if (item.cwd) node.appendChild(el("div", "card-sub mono", item.cwd));
    // 输出正文在网关侧已截断成预览，这里只展示这一小段。
    const output = item.aggregatedOutput || "";
    if (output) node.appendChild(rawBlock("输出预览", output, String(item.status || "").toLowerCase().indexOf("fail") >= 0));
    return node;
  }
  // fileChange 由 fileBlock 合并展示，不在这里单独渲染。
  if (type === "mcpToolCall" || type === "dynamicToolCall") {
    // 参数与结果在网关侧已去掉，卡片只保留“调用了哪个工具”。
    const node = card("⚙", "MCP " + (item.server || "") + "." + (item.tool || ""), statusChip(item.status));
    if (item.error) node.appendChild(rawBlock("错误", typeof item.error === "string" ? item.error : json(item.error), false));
    return node;
  }
  if (type === "functionCallOutput") {
    const node = card("↳", "工具输出 · " + (item.name || ""));
    node.appendChild(rawBlock("输出预览", typeof item.output === "string" ? item.output : json(item.output), false));
    return node;
  }
  if (type === "plan") {
    const node = card("☰", "计划");
    const body = el("div", "card-pre");
    renderMarkdown(body, item.text || "");
    node.appendChild(body);
    return node;
  }
  if (type === "webSearch") {
    const node = card("⌕", "联网搜索 · " + (item.query || ""));
    return node;
  }
  if (type === "imageView" || type === "imageGeneration") {
    const node = card("▤", type === "imageView" ? "查看图片" : "生成图片");
    node.appendChild(el("div", "card-sub mono", item.path || ""));
    return node;
  }
  if (type === "collabAgentToolCall") {
    const node = card("⧉", "子代理调用 · " + (item.tool || ""));
    if (item.prompt) node.appendChild(rawBlock("提示词", typeof item.prompt === "string" ? item.prompt : json(item.prompt), false));
    return node;
  }
  if (type === "subAgentActivity") {
    return card("⧉", "子代理活动 · " + (item.kind || ""), null);
  }
  if (type === "contextCompaction") return card("⤵", "上下文压缩", null);
  if (type === "enteredReviewMode" || type === "exitedReviewMode") {
    return card("◇", type === "enteredReviewMode" ? "进入评审模式" : "退出评审模式", null);
  }
  const node = card("•", type || "未知项");
  node.appendChild(rawBlock("原始数据", json(item), false));
  return node;
}

/* ================= 对话渲染 ================= */

function isPinned(root) {
  return root.scrollHeight - root.scrollTop - root.clientHeight < 70;
}

/**
 * 贴到底部。移动端浏览器有时会延迟结算滚动高度，赋值一次可能停在半路，
 * 因此重复到高度稳定为止。
 */
function pinToBottom(root) {
  let previous = -1;
  for (let i = 0; i < 6 && previous !== root.scrollHeight; i += 1) {
    previous = root.scrollHeight;
    root.scrollTop = root.scrollHeight;
    void root.scrollHeight;
  }
}

function scrollToBottom() {
  pinToBottom($("transcript"));
  $("toBottom").hidden = true;
}

function updateToBottom() {
  const root = $("transcript");
  const show = root.scrollHeight - root.scrollTop - root.clientHeight > 120;
  $("toBottom").hidden = !show;
}

function renderTranscript(forceScroll) {
  const root = $("transcript");
  const pinned = forceScroll || isPinned(root);
  const keep = root.scrollTop;
  root.textContent = "";
  state.live.clear();
  if (!state.threadId) {
    const empty = el("div", "empty");
    empty.appendChild(el("div", "big", "选择一个对话"));
    empty.appendChild(el("div", null, isMobile() ? "点左上角返回列表，选择一个会话开始。" : "左侧列出本机全部对话，包含桌面端没有打开的会话。"));
    root.appendChild(empty);
    updateToBottom();
    return;
  }
  if (!state.turns.length) {
    root.appendChild(el("div", "empty", "这个会话还没有消息。"));
  }
  if (state.nextCursor) {
    const more = el("button", "more-btn", "加载更早的消息");
    more.type = "button";
    more.addEventListener("click", () => loadTurns(state.nextCursor).catch(reportError));
    root.appendChild(more);
  } else if (state.turns.length >= MAX_TURNS) {
    root.appendChild(el("div", "more-hint", "仅显示最近 " + MAX_TURNS + " 个回合"));
  }
  const ordered = state.turns.slice().reverse();
  for (const turn of ordered) {
    const node = el("div", "turn");
    node.id = "turn-" + turn.id;
    const head = el("div", "turn-head");
    const stamp = turn.createdAt || turn.startedAt || turn.completedAt;
    head.appendChild(el("span", null, stamp ? relTime(stamp) : "回合"));
    const meta = turnMeta(turn);
    if (meta) head.appendChild(el("span", "meta", meta));
    head.appendChild(el("span", "line"));
    const chip = statusChip(turn.status, null);
    if (chip) head.appendChild(chip);
    node.appendChild(head);
    // 思考过程只显示步数：app-server 会按推理步骤拆成很多条（长回合上百条），
    // 全文在网关侧就已去掉，既省流量也省渲染。
    const thoughtCount = (turn.items || []).filter((item) => item && item.type === "reasoning").length;
    let thoughtPlaced = !thoughtCount;
    // 连续的同类条目合并：工具与命令、文件改动各自只留一张卡片。
    let run = [];
    let runKind = null;
    const flushRun = () => {
      if (!run.length) return;
      node.appendChild(runKind === "files" ? fileBlock(run) : toolGroup(run));
      run = [];
      runKind = null;
    };
    const pushRun = (item, kind) => {
      if (runKind !== kind) flushRun();
      runKind = kind;
      run.push(item);
    };
    for (const item of turn.items || []) {
      if (!item) continue;
      if (item.type === "reasoning") {
        if (!thoughtPlaced) {
          thoughtPlaced = true;
          flushRun();
          const think = el("div", "think");
          think.appendChild(el("span", "icon", "✳"));
          think.appendChild(el("span", null, "思考 " + thoughtCount + " 次"));
          node.appendChild(think);
        }
        continue;
      }
      if (TOOL_TYPES.has(item.type)) { pushRun(item, "tools"); continue; }
      if (item.type === "fileChange") { pushRun(item, "files"); continue; }
      flushRun();
      const rendered = renderItem(item);
      if (rendered) node.appendChild(rendered);
    }
    flushRun();
    root.appendChild(node);
  }
  if (pinned) pinToBottom(root);
  else root.scrollTop = keep;
  updateToBottom();
}

function renderThreads() {
  const root = $("threads");
  root.textContent = "";
  $("threadCount").textContent = state.threads.length ? state.threads.length + " 个会话" : "";
  if (!state.loaded) {
    for (let index = 0; index < 6; index += 1) root.appendChild(el("div", "skeleton"));
    return;
  }
  if (!state.threads.length) {
    root.appendChild(el("div", "empty", "没有匹配的对话"));
    return;
  }
  let group = null;
  for (const thread of state.threads) {
    const next = groupOf(thread.updatedAt);
    if (next !== group) {
      group = next;
      root.appendChild(el("div", "group-label", group));
    }
    const running = !!(thread.status && thread.status.type === "active");
    const node = el("div", "thread" + (thread.id === state.threadId ? " active" : ""));
    const top = el("div", "t-top");
    top.appendChild(el("span", "t-name", thread.name || preview(thread.preview) || "(未命名)"));
    if (running) {
      const badge = el("span", "run-badge");
      badge.appendChild(el("i"));
      badge.appendChild(el("span", null, "运行中"));
      top.appendChild(badge);
    }
    node.appendChild(top);
    const line = preview(thread.preview);
    if (line && line !== thread.name) node.appendChild(el("div", "t-prev", line));
    const meta = el("div", "t-meta");
    if (thread.cwd) meta.appendChild(el("span", "mono", preview(String(thread.cwd).split(/[\\/]/).pop() || thread.cwd, 24)));
    if (thread.model) {
      meta.appendChild(el("span", "sep", "·"));
      meta.appendChild(el("span", null, thread.model));
    }
    meta.appendChild(el("span", "sep", "·"));
    meta.appendChild(el("span", null, relTime(thread.updatedAt)));
    node.appendChild(meta);
    node.addEventListener("click", () => openThread(thread.id).catch(reportError));
    root.appendChild(node);
  }
}

function renderChatHead() {
  const thread = (state.detail && state.detail.thread) || null;
  $("chatTitle").textContent = thread ? (thread.name || preview(thread.preview) || state.threadId || "对话") : "选择一个对话";
  const meta = [];
  if (thread) {
    if (thread.cwd) meta.push(thread.cwd);
    if (state.detail.model) meta.push(state.detail.model);
    if (state.activeTurnId) meta.push("运行中");
    const total = formatTokens(state.usage.total && state.usage.total.total_tokens);
    if (total) meta.push("累计 " + total + " tokens");
  }
  $("chatMeta").textContent = meta.join(" · ");
}

function updateModelChip() {
  const model = currentModel();
  const name = (state.detail && state.detail.model) || (model && (model.displayName || model.id)) || "跟随会话";
  const effort = $("effort").value;
  $("modelChipText").textContent = effort ? name + " · " + effort : name;
}

/* ================= 模型与强度 ================= */

function renderModels() {
  const select = $("model");
  select.textContent = "";
  const blank = el("option", null, "（跟随会话）");
  blank.value = "";
  select.appendChild(blank);
  for (const model of state.models) {
    const option = el("option", null, String(model.displayName || model.id || model.model || ""));
    option.value = model.id || model.model || "";
    select.appendChild(option);
  }
  select.value = (state.detail && state.detail.model) || "";
  renderEfforts();
}

function currentModel() {
  const id = $("model").value;
  return state.models.find((model) => (model.id || model.model) === id) || null;
}

function renderEfforts() {
  const select = $("effort");
  select.textContent = "";
  const blank = el("option", null, "（默认强度）");

  select.appendChild(blank);

function openSheet() {
  const info = $("sheetInfo");
  info.textContent = "";
  if (state.threadId) {
    info.appendChild(el("div", null, "会话：" + (state.threadId || "")));
    if (state.detail && state.detail.cwd) info.appendChild(el("div", null, "工作目录：" + state.detail.cwd));
  } else {
    info.appendChild(el("div", null, "先打开一个会话，再选择模型与推理强度。"));
  }
  $("model").disabled = !state.threadId;
  $("effort").disabled = !state.threadId;
  $("overlay").hidden = false;
  $("sheet").hidden = false;
}

function closeSheet() {
  $("overlay").hidden = true;
  $("sheet").hidden = true;
}

/* ================= 会话导航 ================= */

// 取回合里第一条有正文的用户消息，用于导航项的标题。
function turnUserText(turn) {
  for (const item of (turn && turn.items) || []) {
    if (!item || item.type !== "userMessage") continue;
    const parts = [];
    for (const part of item.content || []) {
      if (part && part.type === "text" && part.text) parts.push(part.text);
    }
    const text = parts.join(" ").replace(/\s+/g, " ").trim();
    if (text) return text;
  }
  return "";
}

function openNav() {
  const list = $("navList");
  list.textContent = "";
  // 从最早到最新排列，序号即回合顺序；只列有用户输入的回合。
  const entries = state.turns
    .slice()
    .reverse()
    .map((turn) => ({ turn, text: turnUserText(turn) }))
    .filter((entry) => entry.text);
  if (!entries.length) {
    list.appendChild(el("div", "empty", "还没有可跳转的回合。"));
  }
  entries.forEach((entry, index) => {
    const turn = entry.turn;
    const item = el("button", "nav-item");
    item.type = "button";
    item.appendChild(el("span", "n", String(index + 1)));
    const body = el("div", "nav-body");
    body.appendChild(el("div", "nav-text", preview(entry.text, 140)));
    const meta = [];
    const stamp = turn.completedAt || turn.startedAt || turn.createdAt;
    if (stamp) meta.push(relTime(stamp));
    const duration = formatDuration(turn.durationMs);
    if (duration) meta.push(duration);
    if (meta.length) body.appendChild(el("div", "nav-meta", meta.join(" · ")));
    item.appendChild(body);
    item.addEventListener("click", () => {
      closeNav();
      scrollToTurn(turn.id);
    });
    list.appendChild(item);
  });
  $("navOverlay").hidden = false;
  $("navSheet").hidden = false;
}

function closeNav() {
  $("navOverlay").hidden = true;
  $("navSheet").hidden = true;
}

function scrollToTurn(id) {
  const node = document.getElementById("turn-" + id);
  if (!node) return;
  node.scrollIntoView({ block: "start", behavior: "smooth" });
  node.classList.add("flash");
  setTimeout(() => node.classList.remove("flash"), 1200);
}

/* ================= 数据加载 ================= */

function reportError(error) {
  const message = error && error.message ? error.message : String(error);
  toast(message, "bad");
}

async function loadThreads() {
  const search = $("search").value.trim();
  const query = search ? "?search=" + encodeURIComponent(search) : "";
  const body = await api("/api/threads" + query);
  state.threads = body.threads || [];
  state.loaded = true;
  renderThreads();
}

async function loadModels() {
  const body = await api("/api/models");
  state.models = body.models || [];
  renderModels();
}

async function loadTurns(cursor) {
  const query = "?limit=" + TURNS_PAGE + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
  const body = await api("/api/threads/" + encodeURIComponent(state.threadId) + "/turns" + query);
  const turns = body.turns || [];
  if (cursor) {
    const room = Math.max(0, MAX_TURNS - state.turns.length);
    state.turns = state.turns.concat(turns.slice(0, room));
  } else {
    state.turns = turns.slice(0, MAX_TURNS);
  }
  state.nextCursor = state.turns.length >= MAX_TURNS ? null : (body.nextCursor || null);
  renderTranscript(!cursor);
}

// 用量单独懒加载：网关要扫盘聚合，先渲染正文再补 token，不拖慢会话打开。
async function loadUsage(id) {
  const usage = await api("/api/threads/" + encodeURIComponent(id) + "/usage");
  if (state.threadId !== id || !usage || typeof usage !== "object") return;
  state.usage = { total: usage.total || null, turns: usage.turns || {} };
  renderChatHead();
  // 运行中的回合靠事件流增量渲染，重排会打断它，等回合结束再补上用量。
  if (!state.live.size) renderTranscript(false);
}

function showListView() {
  $("app").dataset.view = "list";
}

function showChatView() {
  $("app").dataset.view = "chat";
}

async function openThread(id) {
  if (state.threadId && state.threadId !== id) closeThread(state.threadId);
  state.threadId = id;
  state.detail = null;
  state.turns = [];
  state.nextCursor = null;
  state.activeTurnId = null;
  state.live.clear();
  state.usage = { total: null, turns: {} };
  state.approvals = [];
  renderApprovals();
  try { localStorage.setItem(LAST_THREAD_KEY, id); } catch { /* 隐私模式下忽略 */ }
  $("chatTitle").textContent = "载入中…";
  $("chatMeta").textContent = "";
  $("transcript").textContent = "";
  renderThreads();
  renderTranscript(true);
  if (isMobile()) {
    showChatView();
    try { history.pushState({ view: "chat", id }, ""); } catch { /* 忽略 */ }
  }
  const detail = await api("/api/threads/" + encodeURIComponent(id));
  state.detail = detail;
  renderChatHead();
  renderModels();
  updateModelChip();
  await loadTurns(null);
  scrollToBottom();
  loadUsage(id).catch(() => {});
}

function closeThread(id) {
  try {
    navigator.sendBeacon("/api/threads/" + encodeURIComponent(id) + "/close?token=" + encodeURIComponent(state.token));
  } catch { /* 关闭失败不影响切换 */ }
}

/* ================= 动作 ================= */

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || !state.threadId) return;
  input.value = "";
  autoGrow();
  try {
    const body = await api("/api/threads/" + encodeURIComponent(state.threadId) + "/messages", {
      method: "POST",
      body: JSON.stringify({ text, model: $("model").value || null, effort: $("effort").value || null }),
    });
    state.activeTurnId = (body.turn && body.turn.id) || null;
    renderChatHead();
    scheduleReload(500);
  } catch (error) {
    input.value = text;
    autoGrow();
    reportError(error);
  }
}

async function stop() {
  if (!state.threadId || !state.activeTurnId) return;
  try {
    await api("/api/threads/" + encodeURIComponent(state.threadId) + "/interrupt", {
      method: "POST",
      body: JSON.stringify({ turnId: state.activeTurnId }),
    });
    toast("已请求停止");
  } catch (error) {
    reportError(error);
  }
}

function scheduleReload(delay) {
  clearTimeout(state.reloadTimer);
  state.reloadTimer = setTimeout(() => {
    if (state.threadId) loadTurns(null).catch(() => {});
  }, delay);
}

function autoGrow() {
  const input = $("input");
  input.style.height = "auto";
  const viewport = window.visualViewport;
  const limit = Math.round(((viewport && viewport.height) || window.innerHeight) * 0.4);
  input.style.height = Math.min(input.scrollHeight, limit) + "px";
}

/* ================= 审批 ================= */

function renderApprovals() {
  const host = $("approvalHost");
  host.textContent = "";
  const head = state.approvals[0];
  if (!head) return;
  const label = head.method === "item/fileChange/requestApproval" ? "请求修改文件" : "请求执行命令";
  const node = el("div", "approval-card");
  node.appendChild(el("div", "label", label));
  const params = head.params || {};
  const summary = preview(params.reason || params.command || params.cwd || "", 200);
  if (summary) node.appendChild(el("div", "body", summary));
  if (params.command && summary !== params.command) node.appendChild(el("pre", null, params.command));
  const actions = el("div", "actions");
  const allow = el("button", "allow", "允许");
  allow.type = "button";
  const decline = el("button", null, "拒绝");
  decline.type = "button";
  allow.addEventListener("click", () => answer(head.key, { decision: "accept" }));
  decline.addEventListener("click", () => answer(head.key, { decision: "decline" }));
  actions.appendChild(allow);
  actions.appendChild(decline);
  node.appendChild(actions);
  host.appendChild(node);
}

async function answer(key, result) {
  state.approvals = state.approvals.filter((item) => item.key !== key);
  renderApprovals();
  try {
    await api("/api/approvals/" + encodeURIComponent(key), {
      method: "POST",
      body: JSON.stringify({ result }),
    });
  } catch (error) {
    reportError(error);
  }
}

/* ================= 事件流 ================= */

function handleEvent(event) {
  if (!event) return;
  if (event.kind === "status") {
    setStatus(event.connected ? "已连接" : "上游离线", event.connected ? "on" : "off");
    if (!event.connected && event.detail) toast(event.detail, "bad");
    return;
  }
  if (event.kind === "lagged") {
    scheduleReload(200);
    return;
  }
  if (event.kind === "request") {
    if (APPROVAL_METHODS.has(event.method)) {
      const key = event.idKey || String(event.id);
      if (!state.approvals.some((item) => item.key === key)) {
        state.approvals.push({ key, method: event.method, params: event.params || {} });
        renderApprovals();
      }
    }
    return;
  }
  if (event.kind !== "notification") return;
  const params = event.params || {};
  if (state.threadId && params.threadId && params.threadId !== state.threadId) return;
  if (event.method === "item/agentMessage/delta") {
    const live = state.live.get(params.itemId);
    if (live) {
      live.text += params.delta || "";
      live.node.classList.add("caret");
      renderLive(live);
      if (isPinned($("transcript"))) scrollToBottom();
      else $("toBottom").querySelector(".new").hidden = false;
    } else {
      scheduleReload(300);
    }
    return;
  }
  if (event.method === "turn/started") {
    state.activeTurnId = (params.turn && params.turn.id) || state.activeTurnId;
    $("stopBtn").hidden = false;
    renderChatHead();
    scheduleReload(200);
    return;
  }
  if (event.method === "item/started") {
    const item = params.item || {};
    if (item.type === "agentMessage" && item.id) {
      const node = agentMessage("");
      node.classList.add("caret");
      state.live.set(item.id, { node, text: typeof item.text === "string" ? item.text : "", frame: 0 });
      $("transcript").appendChild(node);
      if (isPinned($("transcript"))) scrollToBottom();
      return;
    }
    scheduleReload(400);
    return;
  }
  if (event.method === "turn/completed") {
    state.activeTurnId = null;
    $("stopBtn").hidden = true;
    renderChatHead();
    scheduleReload(250);
    return;
  }
  if (event.method === "item/completed") {
    const item = params.item || {};
    const live = item.id ? state.live.get(item.id) : null;
    if (live && item.type === "agentMessage") {
      // 用完成事件里的最终文本重渲染，避免整段重载时服务器尚未返回这条消息。
      if (typeof item.text === "string" && item.text) live.text = item.text;
      live.node.textContent = "";
      renderMarkdown(live.node, live.text);
      live.node.classList.remove("caret");
      state.live.delete(item.id);
      return;
    }
    scheduleReload(350);
  }
}

function connectEvents() {
  const source = new EventSource("/api/events?token=" + encodeURIComponent(state.token));
  source.onopen = () => setStatus("已连接", "on");
  source.onmessage = (message) => {
    try { handleEvent(JSON.parse(message.data)); } catch { /* 忽略单条坏事件 */ }
  };
  source.onerror = () => setStatus("重连中…", "warn");
}

/* ================= 令牌门 ================= */

function showGate(hint) {
  $("gate").hidden = false;
  $("app").hidden = true;
  if (hint) $("gate").querySelector("p").textContent = hint;
  $("gateToken").focus();
}

function readToken() {
  const url = new URL(location.href);
  const fromUrl = url.searchParams.get("token");
  if (fromUrl) {
    sessionStorage.setItem(TOKEN_KEY, fromUrl);
    url.searchParams.delete("token");
    history.replaceState({ view: "list" }, "", url.toString());
  }
  return sessionStorage.getItem(TOKEN_KEY) || "";
}

/* ================= 启动 ================= */

/**
 * 把 app 对齐到当前可见视口。地址栏收放与软键盘弹出会改变可见高度，
 * 部分浏览器还会滚动可视视口（offsetTop 不为 0）来露出输入框；只改高度会
 * 让输入栏被顶到屏幕上方并盖住正文，所以这里同时同步 top 与 height。
 */
function syncViewport() {
  const viewport = window.visualViewport;
  const height = Math.round((viewport && viewport.height) || window.innerHeight || 0);
  if (height > 0) $("app").style.height = height + "px";
  const top = Math.max(0, Math.round((viewport && viewport.offsetTop) || 0));
  $("app").style.top = top + "px";
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
}

function bind() {
  syncViewport();
  window.addEventListener("resize", syncViewport);
  window.addEventListener("orientationchange", syncViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncViewport);
    window.visualViewport.addEventListener("scroll", syncViewport);
  }
  // 键盘弹出/收起有动画，聚焦前后各同步几次，避免输入栏停在中间位置。
  const syncSoon = () => {
    syncViewport();
    for (const delay of [80, 200, 400]) setTimeout(syncViewport, delay);
  };
  $("input").addEventListener("focus", syncSoon);
  $("input").addEventListener("blur", syncSoon);
  $("backBtn").addEventListener("click", () => {
    if (history.state && history.state.view === "chat") history.back();
    else showListView();
  });
  $("refreshBtn").addEventListener("click", () => {
    Promise.all([loadThreads(), loadModels()]).catch(reportError);
  });
  $("modelChip").addEventListener("click", openSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("overlay").addEventListener("click", closeSheet);
  $("navBtn").addEventListener("click", openNav);
  $("navClose").addEventListener("click", closeNav);
  $("navOverlay").addEventListener("click", closeNav);
  $("model").addEventListener("change", () => { renderEfforts(); });
  $("search").addEventListener("input", () => {
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(() => loadThreads().catch(reportError), 300);
  });
  $("composer").addEventListener("submit", (event) => { event.preventDefault(); send(); });
  $("stopBtn").addEventListener("click", stop);
  $("input").addEventListener("input", autoGrow);
  $("input").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      send();
    }
  });
  $("toBottom").addEventListener("click", () => {
    const root = $("transcript");
    pinToBottom(root);
    $("toBottom").hidden = true;
    $("toBottom").querySelector(".new").hidden = true;
  });
  $("transcript").addEventListener("scroll", updateToBottom, { passive: true });
  window.addEventListener("popstate", () => showListView());
  window.addEventListener("beforeunload", () => { if (state.threadId) closeThread(state.threadId); });
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeSheet();
      closeNav();
    }
  });
}

async function boot() {
  state.token = readToken();
  if (!state.token) {
    showGate();
    $("gateSave").addEventListener("click", () => {
      const value = $("gateToken").value.trim();
      if (!value) return;
      sessionStorage.setItem(TOKEN_KEY, value);
      location.reload();
    });
    return;
  }
  bind();
  setStatus("连接中…", "warn");
  renderThreads();
  renderTranscript(true);
  connectEvents();
  // 网关与桌面共用同一条上游连接，没有独立连接状态时用轮询兜底补齐桌面端发起的回合。
  setInterval(() => {
    if (!state.threadId || state.activeTurnId) return;
    if (!isPinned($("transcript"))) return;
    loadTurns(null).catch(() => {});
  }, 5000);
  try {
    await Promise.all([loadModels(), loadThreads()]);
  } catch (error) {
    reportError(error);
  }
  let last = "";
  try { last = localStorage.getItem(LAST_THREAD_KEY) || ""; } catch { /* 忽略 */ }
  if (last && state.threads.some((thread) => thread.id === last)) {
    openThread(last).catch(() => {});
  } else if (!isMobile() && state.threads.length) {
    openThread(state.threads[0].id).catch(() => {});
  }
}

boot();
</script>
